services:
  proxy:
    image: traefik:v3.6.1
    container_name: hhh-proxy
    command:
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hhh-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
    restart: always
    ports:
      - '${TRAEFIK_HTTP_PORT:-80}:80'
      - '${TRAEFIK_HTTPS_PORT:-443}:443'
    networks:
      - hhh-proxy
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - traefik-certs:/certs
    labels:
      - traefik.enable=true
      # NOTE: the Traefik dashboard/api@internal router is intentionally NOT
      # exposed here. It previously used `PathPrefix(/api)`, which (being a
      # longer, higher-priority rule than the app's `Host(DOMAIN)` catch-all)
      # shadowed the ENTIRE application API — /api/v1/* and the admin panel's
      # /admin/api/auth/* — behind Traefik basic-auth, breaking the mobile app
      # and admin login. If the Traefik dashboard is needed, expose it on a
      # dedicated host (e.g. traefik.${DOMAIN}), never under /api.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    image: hhh/app
    container_name: hhh-app
    build: ./app
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--no-warnings
      - APP_BASE_PATH=${APP_BASE_PATH:-/}
      - MONGO_DB=surveyjs
      - MONGO_HOST=mongo
      - GRAPH_BACKEND=${GRAPH_BACKEND:-neo4j}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - API_SERVICE_SECRET=${API_SERVICE_SECRET}
      # Internal-only client for the admin Backups page — see backup-service/api/.
      - BACKUP_API_URL=http://backup:4100
      - BACKUP_API_SECRET=${BACKUP_API_SECRET}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-2048}
      # Server-side Prometheus proxy for the admin System-health dashboard.
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      # ── Explicit interpolation for everything that previously arrived only
      # via the server-side .env file. Portainer repository deploys only
      # substitute UI variables into this file (no .env in the git checkout),
      # so every value the app needs must be listed here.
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-hhh}
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/auth/realms/hhh/protocol/openid-connect/certs
      - KEYCLOAK_JWT_ISSUER=https://${DOMAIN}/auth/realms/hhh,http://keycloak:8080/auth/realms/hhh
      - KEYCLOAK_JWT_AUDIENCE=${KEYCLOAK_JWT_AUDIENCE:-account}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-hhh-flutter}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-hhh-backend}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KEYCLOAK_ROPC_CLIENT_ID=${KEYCLOAK_ROPC_CLIENT_ID:-hhh-ropc}
      - KEYCLOAK_ROPC_CLIENT_SECRET=${KEYCLOAK_ROPC_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - API_SERVICE_URL=http://recommender:8000
      - LIBRE_TRANSLATE_URL=http://translate:5000/translate
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      # Dev-only backdoors — hard-default OFF in production.
      - EXPOSE_RECOVERY_PHRASES=${EXPOSE_RECOVERY_PHRASES:-false}
      - ENABLE_TEST_TOOLS=${ENABLE_TEST_TOOLS:-false}
    networks:
      - hhh-proxy
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
      backup:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.routers.app.service=app
      - traefik.http.services.app.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Portainer CE only checks out docker-compose.yml (not the repo's other
  # files), so tracked config under monitoring/, keycloak/, mongo/ and neo4j/ is
  # bind-mounted from a separate on-server clone at ${HHH_REPO_DIR:-/opt/hhh/repo}.
  # This one-shot job refreshes that clone to the deployed ref and fixes read
  # permissions on every (re)deploy, so config changes never need a manual
  # `git pull`. Best-effort: it always exits 0 so a transient fetch failure can't
  # block the stack — services then use the files already on disk. The
  # config-consuming services (mongo, neo4j, keycloak, keycloak-init,
  # blackbox-exporter, prometheus, grafana) depend on it completing.
  config-sync:
    image: alpine/git:latest
    container_name: hhh-config-sync
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        git config --global --add safe.directory /repo || true
        if [ -d /repo/.git ]; then
          if git -C /repo fetch origin "${HHH_CONFIG_REF:-main}" && git -C /repo reset --hard "origin/${HHH_CONFIG_REF:-main}"; then
            echo "config-sync: updated /repo to ${HHH_CONFIG_REF:-main}"
          else
            echo "config-sync: fetch failed — using existing files"
          fi
        else
          echo "config-sync: /repo is not a git clone — run the one-time clone (see DEPLOYMENT.md)"
        fi
        chmod -R a+rX /repo || true
        echo "config-sync: done"
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}:/repo
    networks:
      - hhh-proxy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mongo:
    image: mongo:7.0
    container_name: hhh-mongo
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=surveyjs
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/mongo/entrypoint:/docker-entrypoint-initdb.d:ro
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ping:1})']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mongo-express:
    image: mongo-express:1.0
    container_name: hhh-mongo-express
    restart: always
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
      - ME_CONFIG_SITE_BASEURL=/mongo/
    networks:
      - hhh-proxy
    depends_on:
      - mongo
    healthcheck:
      # Lightweight TCP-connect probe: just confirm the HTTP listener is up on
      # 8081. The previous HTTP GET to /mongo/ was fragile — it is basic-auth
      # gated and renders a page that queries MongoDB, so it timed out during
      # Mongo reconnect windows and flapped the container to "unhealthy" even
      # though mongo-express was serving fine.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(8081, '127.0.0.1', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.mongo-express.rule=Host(`${DOMAIN}`) && PathPrefix(`/mongo`)
      - traefik.http.routers.mongo-express.entrypoints=websecure
      - traefik.http.routers.mongo-express.tls.certresolver=letsencrypt
      - traefik.http.routers.mongo-express.service=mongo-express
      - traefik.http.services.mongo-express.loadbalancer.server.port=8081
      # Second auth layer in front of mongo-express's own basic auth — this is
      # a full DB admin UI, so a single leaked/weak ME_CONFIG_BASICAUTH_PASSWORD
      # shouldn't be the only thing standing between it and the internet.
      - traefik.http.routers.mongo-express.middlewares=mongo-express-auth
      - traefik.http.middlewares.mongo-express-auth.basicauth.users=${MONGO_EXPRESS_TRAEFIK_AUTH}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  translate:
    image: hhh/translate
    build: ./translate
    pull_policy: build
    container_name: hhh-translate
    restart: always
    # No `user:` override — the image runs as its built-in `libretranslate`
    # user, which owns /home/libretranslate/.local/share/argos-translate.
    # Forcing a different UID makes the argos model store unwritable
    # (Permission denied on index.json), so no languages load and the app
    # crashes with `IndexError: list index out of range`.
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-de,en,ja,fr,nl}
      - LT_REQ_LIMIT=${LT_REQ_LIMIT:-0}
    networks:
      - hhh-proxy
    # No volume mount: the libretranslate image ships the language models baked
    # in at /home/libretranslate/.local/share/argos-translate/packages. Mounting
    # a named volume there masks them with an empty dir, so no languages load and
    # startup crashes with `IndexError: list index out of range`. The models are
    # part of the image, so no persistence is needed.
    depends_on:
      - app
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.translate.rule=Host(`${DOMAIN}`) && PathPrefix(`/translate`)
      - traefik.http.routers.translate.entrypoints=websecure
      - traefik.http.routers.translate.tls.certresolver=letsencrypt
      - traefik.http.routers.translate.service=translate
      - traefik.http.services.translate.loadbalancer.server.port=5000
      - traefik.http.middlewares.translate-strip.stripprefix.prefixes=/translate
      - traefik.http.routers.translate.middlewares=translate-strip
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  neo4j:
    image: neo4j:5
    container_name: hhh-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_server_directories_import=/import
      - NEO4J_PLUGINS=["graph-data-science"]
    # No published ports: like prometheus, neo4j is internal-only in
    # production, reachable only from other containers on hhh-proxy
    # (app connects via bolt://neo4j:7687). Publishing 7474/7687 to the
    # host exposed the browser/bolt endpoints over plaintext with no TLS.
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/neo4j/import:/import:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:7474']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  keycloak-db:
    image: postgres:16-alpine
    container_name: hhh-keycloak-db
    restart: always
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KC_DB_USERNAME:-keycloak}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    networks:
      - hhh-proxy
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KC_DB_USERNAME:-keycloak} -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: hhh-keycloak
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      # Realm import substitutes ${DOMAIN} in the hhh-admin client redirect URIs
      # (https://${DOMAIN}/admin/*); without DOMAIN in the container env it would
      # import literally and every OAuth callback would fail "Invalid redirect_uri".
      - DOMAIN=${DOMAIN}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
    command: start --import-realm --health-enabled=true
    networks:
      - hhh-proxy
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/keycloak/hhh-realm.json:/opt/keycloak/data/import/hhh-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      config-sync:
        condition: service_completed_successfully
    healthcheck:
      # The Keycloak 26 image (ubi9-micro) has no curl — probe the management
      # port (9000) with bash's built-in /dev/tcp instead.
      # NOTE: KC_HTTP_RELATIVE_PATH=/auth moves the management health endpoints
      # under /auth, so the path is /auth/health/ready (not /health/ready — that
      # returns 404 here, unlike docker-compose.local.yml which sets no relative
      # path).
      test:
        [
          'CMD-SHELL',
          "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`${DOMAIN}`) && PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt
      - traefik.http.routers.keycloak.service=keycloak
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: hhh-keycloak-init
    restart: 'no'
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      # The bootstrap script below reads these from the container environment —
      # explicit interpolation so Portainer UI variables reach it (see the
      # env_file note above).
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - HHH_ADMIN_USER=${HHH_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_UI_CLIENT_SECRET=${KEYCLOAK_ADMIN_UI_CLIENT_SECRET}
      - KEYCLOAK_ROPC_CLIENT_SECRET=${KEYCLOAK_ROPC_CLIENT_SECRET}
      - GRAFANA_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET}
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/keycloak/hhh-user-profile.json:/opt/keycloak/bootstrap/hhh-user-profile.json:ro
    networks:
      - hhh-proxy
    depends_on:
      keycloak:
        condition: service_healthy
      config-sync:
        condition: service_completed_successfully
    entrypoint: ['/bin/sh', '-lc']
    command: >
      'until /opt/keycloak/bin/kcadm.sh config credentials
      --server http://keycloak:8080/auth
      --realm master
      --user "$$KEYCLOAK_ADMIN"
      --password "$$KEYCLOAK_ADMIN_PASSWORD";
      do sleep 2; done &&
      /opt/keycloak/bin/kcadm.sh update realms/hhh -s offlineSessionIdleTimeout=15552000 -s offlineSessionMaxLifespanEnabled=false &&
      /opt/keycloak/bin/kcadm.sh update users/profile -r hhh -f /opt/keycloak/bootstrap/hhh-user-profile.json &&
      BACKEND_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-backend --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$BACKEND_ID -r hhh -s secret="$$KEYCLOAK_ADMIN_CLIENT_SECRET" &&
      ADMIN_UI_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-admin --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ADMIN_UI_ID -r hhh -s secret="$$KEYCLOAK_ADMIN_UI_CLIENT_SECRET" &&
      ROPC_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-ropc --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ROPC_ID -r hhh -s secret="$$KEYCLOAK_ROPC_CLIENT_SECRET" &&
      GRAFANA_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=grafana --fields id --format csv --noquotes) &&
      if [ -n "$$GRAFANA_ID" ]; then
        /opt/keycloak/bin/kcadm.sh update clients/$$GRAFANA_ID -r hhh -s secret="$$GRAFANA_CLIENT_SECRET";
      else
        echo "WARNING: grafana client not found — recreate the Keycloak volume (or add the client) so the realm re-imports it" >&2;
      fi &&
      SA_ID=$$(/opt/keycloak/bin/kcadm.sh get clients/$$BACKEND_ID/service-account-user -r hhh --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$SA_ID --cclientid realm-management --rolename realm-admin &&
      HHH_ADMIN_USER="$${HHH_ADMIN_USER:-$$KEYCLOAK_ADMIN}" &&
      HHH_ADMIN_ID=$$(/opt/keycloak/bin/kcadm.sh get users -r hhh -q username=$$HHH_ADMIN_USER -q exact=true --fields id --format json 2>/dev/null | grep -o "\"id\" *: *\"[^\"]*\"" | head -n1 | grep -o "\"[^\"]*\"$$" | tr -d "\"") &&
      if [ -z "$$HHH_ADMIN_ID" ]; then
        echo "Creating HHH admin user: $$HHH_ADMIN_USER" &&
        /opt/keycloak/bin/kcadm.sh create users -r hhh -s username="$$HHH_ADMIN_USER" -s enabled=true -s emailVerified=true &&
        HHH_ADMIN_ID=$$(/opt/keycloak/bin/kcadm.sh get users -r hhh -q username=$$HHH_ADMIN_USER -q exact=true --fields id --format json 2>/dev/null | grep -o "\"id\" *: *\"[^\"]*\"" | head -n1 | grep -o "\"[^\"]*\"$$" | tr -d "\"");
      fi &&
      if [ -z "$$HHH_ADMIN_ID" ]; then
        echo "ERROR: could not create or find HHH admin user $$HHH_ADMIN_USER" >&2 && exit 1;
      fi &&
      /opt/keycloak/bin/kcadm.sh set-password -r hhh --userid $$HHH_ADMIN_ID --new-password "$$KEYCLOAK_ADMIN_PASSWORD" --temporary=false &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$HHH_ADMIN_ID --rolename admin &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$HHH_ADMIN_ID --rolename researcher &&
      echo "HHH admin user $$HHH_ADMIN_USER provisioned successfully (id=$$HHH_ADMIN_ID)"'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: hhh-redis
    restart: always
    networks:
      - hhh-proxy
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      # Password is interpolated by docker-compose at parse time, same as
      # in `command:` above — visible via `docker inspect`, no worse than
      # the existing exposure there.
      test:
        [
          'CMD-SHELL',
          'redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  lightrag:
    image: hhh/lightrag
    container_name: hhh-lightrag
    build: ./lightrag
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-alias-ha}
      - LIGHTRAG_LLM_MODEL=${LIGHTRAG_LLM_MODEL:-alias-huge-no-thinking}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - LLM_HEALTH_CHECK_INTERVAL_S=${LLM_HEALTH_CHECK_INTERVAL_S:-120}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      # LLM/embedding credentials — previously .env-file-only (see env_file note).
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://llm.scads.ai/v1}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://llm.scads.ai/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-2560}
    volumes:
      - lightrag-data:/app/data
    networks:
      - hhh-proxy
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-sf',
          '-H',
          'X-API-Key: ${LIGHTRAG_API_KEY}',
          'http://localhost:9621/documents',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  knowledge-mcp:
    image: hhh/knowledge-mcp
    container_name: hhh-knowledge-mcp
    build: ./knowledge-mcp
    pull_policy: build
    restart: always
    environment:
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://lightrag:9621}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
    networks:
      - hhh-proxy
    depends_on:
      - lightrag
    healthcheck:
      # FastMCP serves SSE, not a plain REST endpoint — a TCP-connect check
      # is a safer liveness probe than GETing the SSE stream path.
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import socket; socket.create_connection(('localhost', 8002), timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  recommender:
    image: hhh/recommender
    container_name: hhh-recommender
    build: ./API-service
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - API_SERVICE_SECRET=${API_SERVICE_SECRET}
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://lightrag:9621}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
      - MONGO_HOST=mongo
      - MONGO_DB=surveyjs
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=admin
    networks:
      - hhh-proxy
    depends_on:
      redis:
        condition: service_started
      lightrag:
        condition: service_started
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  admin:
    image: hhh/admin
    container_name: hhh-admin
    pull_policy: build
    build:
      context: ./admin
      # NEXT_PUBLIC_* vars are inlined into the client bundle at `next build`
      # time — they must be passed as build args, not just runtime
      # `environment:` (which has no effect on an already-built image). Kept
      # in sync with the values below.
      args:
        NEXT_PUBLIC_NEXTAUTH_URL: https://${DOMAIN}/admin
        NEXT_PUBLIC_KEYCLOAK_BROWSER_URL: https://${DOMAIN}/auth
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_API_DOCS_URL: https://${DOMAIN}/api-docs
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-https://${DOMAIN}/grafana}
        NEXT_PUBLIC_MONGO_EXPRESS_URL: https://${DOMAIN}/mongo
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      # NextAuth v4 with a Next.js basePath (/admin) needs the FULL path to its
      # API here, including /api/auth — otherwise it emits sign-in/callback/CSRF
      # links at /admin/* instead of /admin/api/auth/*, and login loops on
      # /admin/signin?csrf=true. NEXT_PUBLIC_NEXTAUTH_URL stays the app base
      # (/admin) — it's used for post-logout redirects, not NextAuth routing.
      - NEXTAUTH_URL=https://${DOMAIN}/admin/api/auth
      - NEXT_PUBLIC_NEXTAUTH_URL=https://${DOMAIN}/admin
      - NEXT_PUBLIC_KEYCLOAK_BROWSER_URL=https://${DOMAIN}/auth
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api/v1
      - NEXT_PUBLIC_API_DOCS_URL=https://${DOMAIN}/api-docs
      - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-https://${DOMAIN}/grafana}
      - NEXT_PUBLIC_MONGO_EXPRESS_URL=https://${DOMAIN}/mongo
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_CLIENT_ID=hhh-admin
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_ADMIN_UI_CLIENT_SECRET}
      # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so EVERY realm endpoint
      # lives under /auth — including the server-to-server token/userinfo/JWKS
      # calls the admin makes over the internal Docker hostname. Omitting /auth
      # here makes the token exchange 404 and NextAuth fails with
      # `error=OAuthCallback` after Keycloak has already authenticated the user.
      # The issuer must match what Keycloak stamps on tokens minted via that
      # internal endpoint (cf. the backend's KEYCLOAK_JWT_ISSUER, which accepts
      # both the public and internal forms).
      - KEYCLOAK_ISSUER=http://keycloak:8080/auth/realms/hhh
      - KEYCLOAK_BROWSER_URL=https://${DOMAIN}/auth
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
    networks:
      - hhh-proxy
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${DOMAIN}`) && PathPrefix(`/admin`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls.certresolver=letsencrypt
      - traefik.http.routers.admin.service=admin
      - traefik.http.services.admin.loadbalancer.server.port=3001
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Internal-only reachability prober for services with no native Prometheus
  # metrics — no host mounts, no elevated privileges (unlike e.g. cAdvisor),
  # just outbound TCP-connect/HTTP-GET probes against the same internal
  # hostnames every other service already talks to on hhh-proxy. Feeds the
  # Grafana "service unreachable" alert rule — see docs/runbook.md.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hhh-blackbox-exporter
    restart: always
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9115/-/healthy',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: hhh-prometheus
    restart: always
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9090/-/healthy',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  grafana:
    image: grafana/grafana-oss:12.0.1
    container_name: hhh-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # ── Keycloak SSO (generic OAuth) ─────────────────────────────────────
      # Browser-facing endpoints use the public https://${DOMAIN}/auth URL so
      # the token issuer matches; the "grafana" realm client secret is injected
      # into Keycloak by keycloak-init from GRAFANA_CLIENT_SECRET.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile roles
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${DOMAIN}/auth/realms/hhh/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://${DOMAIN}/auth/realms/hhh/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://${DOMAIN}/auth/realms/hhh/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      # Map Keycloak realm roles -> Grafana roles (admin=Admin, researcher=Editor, else Viewer).
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'researcher') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      # Let users click straight through to Keycloak instead of the local login form.
      - GF_AUTH_OAUTH_AUTO_LOGIN=false
      # ── SMTP (critical-alert emails) ─────────────────────────────────────
      # Same generic SMTP_* credentials used by backup.sh and API-service's
      # alerting.py — one transport, one recipient (see .env.example's "Mail
      # (generic SMTP)" section). Static env vars only, no bootstrap-ordering
      # dependency: unlike keycloak-init, nothing needs to wait for Grafana to
      # be healthy first — Grafana reads these at its own startup.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT:-587}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASS}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-noreply@example.com}
      - GF_SMTP_FROM_NAME=Health Habit Hub Alerts
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      # Contact-point recipient for the provisioned alert rules (see
      # monitoring/grafana/provisioning/alerting/alerting.yaml).
      - HHH_ALERT_EMAIL=${ALERT_EMAIL:-}
    networks:
      - hhh-proxy
    volumes:
      - grafana-data:/var/lib/grafana
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard provider (provisioning/dashboards/dashboard.yml) reads JSON
      # from /etc/grafana/dashboards — mount it, or Grafana logs a repeating
      # "stat /etc/grafana/dashboards: no such file or directory" every 10s.
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      config-sync:
        condition: service_completed_successfully
    healthcheck:
      # GF_SERVER_SERVE_FROM_SUB_PATH=true means the API is mounted under
      # /grafana internally too, not just at the public router path.
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/grafana/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${DOMAIN}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backup:
    image: hhh/backup
    container_name: hhh-backup
    build: ./backup-service
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - OFFSITE_REMOTE=${OFFSITE_REMOTE:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - BACKUP_EMAIL=${BACKUP_EMAIL:-}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      # Reachable directly over hhh-proxy (pg_dump/psql connect over the network
      # to the running server — unlike Neo4j's offline neo4j-admin dump, no
      # docker-socket-proxy access is needed for the Keycloak DB backup/restore).
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      # Internal-only HTTP API used by the admin panel's Backups page
      # (status/trigger/restore/upload) — never published to the host, only
      # reachable from other containers on hhh-proxy.
      - BACKUP_API_SECRET=${BACKUP_API_SECRET}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-2048}
      # docker.sock is never mounted directly into this container (that would
      # be root-equivalent host access) — the docker CLI talks to the scoped
      # docker-socket-proxy below instead, reachable only on the
      # hhh-backup-internal network.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ${HHH_DATA_DIR:-/opt/hhh/data}/backups:/backups
      # If OFFSITE_REMOTE is set: this container now runs backup.sh/restore.sh
      # as a non-root user (docker-entrypoint.sh chowns /backups on start, but
      # cannot chown this read-only mount) — ensure these files are readable
      # by "other" on the host, e.g. `chmod -R o+r /opt/hhh/data/rclone`.
      - ${HHH_DATA_DIR:-/opt/hhh/data}/rclone:/config/rclone:ro
      - lightrag-data:/lightrag:ro
    networks:
      - hhh-proxy
      - hhh-backup-internal
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      lightrag:
        condition: service_started
      keycloak-db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    # Also starts the internal backup-api HTTP server (see backup-service/api/)
    # used by the admin panel. The schedule itself is a sleep loop, not real
    # cron — see docs/runbook.md — so "next backup" drifts by up to a few
    # minutes on every restart of this container.
    command: /bin/bash -c "node /backup-api/server.js & echo 'Waiting 2 minutes for services to stabilize...'; sleep 120; while true; do BACKUP_TRIGGER=scheduled /backup.sh; sleep 86400; done"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4100/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Scoped proxy in front of the real docker.sock — only the backup
  # container can reach it (hhh-backup-internal is not joined by anything
  # else), and it exposes only the container/volume/image lifecycle calls
  # backup.sh / restore.sh actually issue (start/stop/create/run for the
  # neo4j-admin dump sidecar). EXEC, NETWORKS, SWARM, SECRETS, NODES,
  # PLUGINS, SERVICES, CONFIGS, BUILD, COMMIT, SESSION and AUTH stay
  # disabled, so a compromised backup-api can no longer exec into or
  # reconfigure arbitrary unrelated containers.
  # NOTE: POST+CONTAINERS+VOLUMES together still allow creating a container
  # with an arbitrary bind mount, which is inherently root-equivalent — this
  # narrows the blast radius (network isolation + reduced API surface) but
  # does not eliminate it. A full fix would replace `docker run
  # --volumes-from hhh-neo4j` in backup.sh/restore.sh with `docker exec`
  # into the already-running neo4j container so no socket access is needed
  # at all; that's a larger change tracked separately.
  # No healthcheck: this image is a minimal, security-hardened Go binary with
  # no shell/curl/wget/python available to probe it with, by design (smaller
  # attack surface). `backup`'s `depends_on: condition: service_started`
  # above is the extent of orchestration that makes sense here.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: hhh-docker-socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - VOLUMES=1
      - IMAGES=1
      - POST=1
      - EXEC=0
      - NETWORKS=0
      - SWARM=0
      - SERVICES=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - CONFIGS=0
      - BUILD=0
      - COMMIT=0
      - SESSION=0
      - AUTH=0
      - DISTRIBUTION=0
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - hhh-backup-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  hhh-proxy:
    name: hhh-proxy
  hhh-backup-internal:
    name: hhh-backup-internal
    internal: true

volumes:
  traefik-certs:
    name: hhh-traefik-certs
  mongo-data:
    name: hhh-mongo-data
  mongo-config:
    name: hhh-mongo-config
  neo4j-data:
    name: hhh-neo4j-data
  neo4j-logs:
    name: hhh-neo4j-logs
  keycloak-db-data:
    name: hhh-keycloak-db-data
  redis-data:
    name: hhh-redis-data
  lightrag-data:
    name: hhh-lightrag-data
  prometheus-data:
    name: hhh-prometheus-data
  grafana-data:
    name: hhh-grafana-data
