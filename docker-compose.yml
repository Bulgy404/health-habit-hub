services:
  proxy:
    image: traefik:v3.6.1
    container_name: hhh-proxy
    command:
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hhh-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Dedicated entrypoint for Neo4j's bolt-over-websocket channel (used by
      # the Browser UI at /neo4j to actually run queries — see neo4j service
      # labels below). It can't share the websecure entrypoint's Host($DOMAIN)
      # routing the way path-based tools do, because the Bolt URI scheme has
      # no path component: the driver in the browser only ever knows
      # host:port, never a path. A separate port on the SAME $DOMAIN sidesteps
      # that without needing a whole new subdomain/DNS record — Traefik
      # reuses the cert already issued for $DOMAIN on websecure (same SNI),
      # it just needs this port reachable (open it in your firewall/security
      # group alongside 80/443).
      - --entrypoints.neo4jbolt.address=:7687
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
    restart: always
    ports:
      - '${TRAEFIK_HTTP_PORT:-80}:80'
      - '${TRAEFIK_HTTPS_PORT:-443}:443'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    networks:
      - hhh-proxy
      # Reaches identity-service (verified-identity studies); see hhh-identity-edge.
      - hhh-identity-edge
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - traefik-certs:/certs
    labels:
      - traefik.enable=true
      # NOTE: the Traefik dashboard/api@internal router is intentionally NOT
      # exposed here. It previously used `PathPrefix(/api)`, which (being a
      # longer, higher-priority rule than the app's `Host(DOMAIN)` catch-all)
      # shadowed the ENTIRE application API — /api/v1/* and the admin panel's
      # /admin/api/auth/* — behind Traefik basic-auth, breaking the mobile app
      # and admin login. If the Traefik dashboard is needed, expose it on a
      # dedicated host (e.g. traefik.${DOMAIN}), never under /api.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # SSO gate for the internal tools (Prometheus, Bull Board, RedisInsight, Neo4j
  # Browser UI, mongo-express). Replaces the old per-tool Traefik basic-auth
  # (htpasswd hashes) with a single Keycloak login: oauth2-proxy runs as a
  # Traefik forward-auth backend and only lets accounts holding the realm `admin`
  # role through (study participants with `user` are denied). See the `sso-auth`
  # middleware label below and the per-tool routers that use it.
  # LightRAG is NOT gated here — it uses its own AUTH_ACCOUNTS login (see lightrag
  # service); Neo4j's raw bolt port 7687 can't be SSO-gated and keeps its own auth.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    container_name: hhh-oauth2-proxy
    restart: always
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://${DOMAIN}/auth/realms/hhh
      - OAUTH2_PROXY_CLIENT_ID=oauth2-proxy
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      # 32-byte random; base64/hex both accepted. Rotating it invalidates sessions.
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      # Only realm-`admin` accounts may pass. keycloak-oidc reads realm roles from
      # the token's realm_access.roles (and the `roles` claim the client mapper adds).
      - OAUTH2_PROXY_ALLOWED_ROLES=admin
      - OAUTH2_PROXY_SCOPE=openid email profile roles
      - OAUTH2_PROXY_REDIRECT_URL=https://${DOMAIN}/oauth2/callback
      # Forward-auth mode: no real upstream, just returns 202/200 for /oauth2/auth.
      - OAUTH2_PROXY_UPSTREAMS=static://200
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      # Identify users by preferred_username, NOT email. Keycloak accounts here
      # (esp. admin-created ones) often have no email, and oauth2-proxy otherwise
      # fails the callback with 500 "could not enrich oidc session: neither the
      # id_token nor the profileURL set an email". preferred_username is always
      # present. EMAIL_DOMAINS=* then accepts it regardless of format.
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=preferred_username
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      # Keycloak accounts may not have verified emails; don't block on that.
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_DOMAINS=${DOMAIN}
      - OAUTH2_PROXY_WHITELIST_DOMAINS=${DOMAIN}
    networks:
      - hhh-proxy
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      # Public router for oauth2-proxy's own endpoints (sign_in, start, callback,
      # auth). No auth middleware here — this IS the login surface.
      - traefik.http.routers.oauth2-proxy.rule=Host(`${DOMAIN}`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls.certresolver=letsencrypt
      - traefik.http.routers.oauth2-proxy.service=oauth2-proxy
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180
      # ── Shared SSO middleware, attached to each internal-tool router ──
      # sso-auth forwards each request to oauth2-proxy's ROOT (`/`), NOT
      # `/oauth2/auth`. This matters: `/oauth2/auth` answers 401 when
      # unauthenticated, and Traefik v3's errors middleware can't turn a 401 into
      # a browser redirect (it keeps the 401 status, only swapping the body, so
      # the browser just shows 401 — verified locally). oauth2-proxy's root, in
      # reverse-proxy mode, instead answers 302 → Keycloak for unauthenticated
      # requests, and Traefik forwardAuth propagates that 302 straight to the
      # browser. Authenticated requests get 200 (static upstream) → allowed
      # through, with the identity headers copied onto the request to the tool.
      # trustForwardHeader lets oauth2-proxy read X-Forwarded-Uri so the
      # post-login redirect lands back on the originally-requested tool path.
      - traefik.http.middlewares.sso-auth.forwardauth.address=http://oauth2-proxy:4180/
      - traefik.http.middlewares.sso-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.sso-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username,Authorization
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    image: hhh/app
    container_name: hhh-app
    build: ./app
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--no-warnings
      - APP_BASE_PATH=${APP_BASE_PATH:-/}
      - MONGO_DB=surveyjs
      - MONGO_HOST=mongo
      - GRAPH_BACKEND=${GRAPH_BACKEND:-neo4j}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - API_SERVICE_SECRET=${API_SERVICE_SECRET}
      # Internal-only client for the admin Backups page — see backup-service/api/.
      - BACKUP_API_URL=http://backup:4100
      - BACKUP_API_SECRET=${BACKUP_API_SECRET}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-2048}
      # Server-side Prometheus proxy for the admin System-health dashboard.
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      # ── Explicit interpolation for everything that previously arrived only
      # via the server-side .env file. Portainer repository deploys only
      # substitute UI variables into this file (no .env in the git checkout),
      # so every value the app needs must be listed here.
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-hhh}
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/auth/realms/hhh/protocol/openid-connect/certs
      - KEYCLOAK_JWT_ISSUER=https://${DOMAIN}/auth/realms/hhh,http://keycloak:8080/auth/realms/hhh
      - KEYCLOAK_JWT_AUDIENCE=${KEYCLOAK_JWT_AUDIENCE:-account}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-hhh-flutter}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-hhh-backend}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KEYCLOAK_ROPC_CLIENT_ID=${KEYCLOAK_ROPC_CLIENT_ID:-hhh-ropc}
      - KEYCLOAK_ROPC_CLIENT_SECRET=${KEYCLOAK_ROPC_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - API_SERVICE_URL=http://recommender:8000
      - LIBRE_TRANSLATE_URL=http://translate:5000/translate
      # Voice-input habit donation: recorded audio clips are written here once
      # a donation is actually submitted (see voiceTranscribeRouter.js), keyed
      # by the donation's uuid — retrievable later for research review.
      - AUDIO_STORAGE_DIR=/data/audio-recordings
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      # Dev-only backdoors — hard-default OFF in production.
      - EXPOSE_RECOVERY_PHRASES=${EXPOSE_RECOVERY_PHRASES:-false}
      - ENABLE_TEST_TOOLS=${ENABLE_TEST_TOOLS:-false}
      # Mounts the Bull Board queue dashboard at /queues in production. Safe
      # only because the /queues Traefik router below gates it behind Keycloak
      # SSO (admin role) — Bull Board has no auth of its own.
      - ENABLE_QUEUE_DASHBOARD=${ENABLE_QUEUE_DASHBOARD:-true}
    networks:
      - hhh-proxy
      # Reaches identity-service (verified-identity studies); see hhh-identity-edge.
      - hhh-identity-edge
    depends_on:
      config-sync:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
      backup:
        condition: service_started
    # `build: ./app` means the maintenance scripts at repo-root scripts/ (e.g.
    # migrate-habits-bcio.js — see DEPLOYMENT.md's `docker exec hhh-app node
    # scripts/...`) are never baked into this image. Same fix as the other
    # config-sync consumers below: bind-mount the real checkout instead of
    # widening the build context (Portainer's git-stack checkout only pulls
    # the compose file itself, so a relative `./scripts` bind wouldn't work —
    # see the config-sync comment above).
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/scripts:/usr/src/scripts:ro
      - audio-recordings-data:/data/audio-recordings
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.routers.app.service=app
      - traefik.http.services.app.loadbalancer.server.port=3000
      # Bull Board queue dashboard, served by this same container at /queues
      # (see app.js — deliberately not under /admin, which routes to the admin
      # panel). Its own router so the basic-auth middleware applies ONLY to
      # /queues and not to the app's catch-all Host rule above. PathPrefix is
      # longer than that catch-all, so Traefik gives this router priority.
      - traefik.http.routers.queues.rule=Host(`${DOMAIN}`) && PathPrefix(`/queues`)
      - traefik.http.routers.queues.entrypoints=websecure
      - traefik.http.routers.queues.tls.certresolver=letsencrypt
      - traefik.http.routers.queues.service=app
      # No stripprefix: setBasePath('/queues') already makes Bull Board emit
      # asset/API URLs under /queues, so it expects the prefix intact.
      # Gated by Keycloak SSO (admin role) — see oauth2-proxy service.
      - traefik.http.routers.queues.middlewares=sso-auth
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Portainer CE only checks out docker-compose.yml (not the repo's other
  # files), so tracked config under monitoring/, keycloak/, mongo/ and neo4j/ is
  # bind-mounted from a separate on-server clone at ${HHH_REPO_DIR:-/opt/hhh/repo}.
  # This one-shot job refreshes that clone to the deployed ref and fixes read
  # permissions on every (re)deploy, so config changes never need a manual
  # `git pull`. Best-effort: it always exits 0 so a transient fetch failure can't
  # block the stack — services then use the files already on disk. The
  # config-consuming services (mongo, neo4j, keycloak, keycloak-init,
  # blackbox-exporter, prometheus, grafana) depend on it completing.
  config-sync:
    image: alpine/git:latest
    container_name: hhh-config-sync
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        git config --global --add safe.directory /repo || true
        if [ -d /repo/.git ]; then
          if git -C /repo fetch origin "${HHH_CONFIG_REF:-main}" && git -C /repo reset --hard "origin/${HHH_CONFIG_REF:-main}"; then
            echo "config-sync: updated /repo to ${HHH_CONFIG_REF:-main}"
          else
            echo "config-sync: fetch failed — using existing files"
          fi
        else
          echo "config-sync: /repo is not a git clone — run the one-time clone (see DEPLOYMENT.md)"
        fi
        chmod -R a+rX /repo || true
        echo "config-sync: done"
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}:/repo
    networks:
      - hhh-proxy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mongo:
    image: mongo:7.0
    container_name: hhh-mongo
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=surveyjs
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/mongo/entrypoint:/docker-entrypoint-initdb.d:ro
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ping:1})']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mongo-express:
    image: mongo-express:1.0
    container_name: hhh-mongo-express
    restart: always
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongo:27017/
      # mongo-express's own basic auth is disabled — access is now gated by
      # Keycloak SSO at the Traefik layer (sso-auth below), so a second login
      # here would just be a redundant prompt. The var is ME_CONFIG_BASICAUTH
      # (boolean); mongo-express 1.0.2 IGNORES ME_CONFIG_BASICAUTH_ENABLED, and
      # without this it falls back to a basic-auth prompt whose old credentials
      # no longer exist — locking you out even after SSO.
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_SITE_BASEURL=/mongo/
    networks:
      - hhh-proxy
    depends_on:
      - mongo
    healthcheck:
      # Lightweight TCP-connect probe: just confirm the HTTP listener is up on
      # 8081. The previous HTTP GET to /mongo/ was fragile — it is basic-auth
      # gated and renders a page that queries MongoDB, so it timed out during
      # Mongo reconnect windows and flapped the container to "unhealthy" even
      # though mongo-express was serving fine.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(8081, '127.0.0.1', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.mongo-express.rule=Host(`${DOMAIN}`) && PathPrefix(`/mongo`)
      - traefik.http.routers.mongo-express.entrypoints=websecure
      - traefik.http.routers.mongo-express.tls.certresolver=letsencrypt
      - traefik.http.routers.mongo-express.service=mongo-express
      - traefik.http.services.mongo-express.loadbalancer.server.port=8081
      # Gated by Keycloak SSO (admin role) — see oauth2-proxy service. This is a
      # full DB admin UI, so the admin-role gate is the single line of defense.
      - traefik.http.routers.mongo-express.middlewares=sso-auth
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  translate:
    image: hhh/translate
    build: ./translate
    pull_policy: build
    container_name: hhh-translate
    restart: always
    # No `user:` override — the image runs as its built-in `libretranslate`
    # user, which owns /home/libretranslate/.local/share/argos-translate.
    # Forcing a different UID makes the argos model store unwritable
    # (Permission denied on index.json), so no languages load and the app
    # crashes with `IndexError: list index out of range`.
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-de,en,ja,fr,nl}
      - LT_REQ_LIMIT=${LT_REQ_LIMIT:-0}
    networks:
      - hhh-proxy
    # No volume mount: the libretranslate image ships the language models baked
    # in at /home/libretranslate/.local/share/argos-translate/packages. Mounting
    # a named volume there masks them with an empty dir, so no languages load and
    # startup crashes with `IndexError: list index out of range`. The models are
    # part of the image, so no persistence is needed.
    depends_on:
      - app
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.translate.rule=Host(`${DOMAIN}`) && PathPrefix(`/translate`)
      - traefik.http.routers.translate.entrypoints=websecure
      - traefik.http.routers.translate.tls.certresolver=letsencrypt
      - traefik.http.routers.translate.service=translate
      - traefik.http.services.translate.loadbalancer.server.port=5000
      - traefik.http.middlewares.translate-strip.stripprefix.prefixes=/translate
      - traefik.http.routers.translate.middlewares=translate-strip
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  neo4j:
    image: neo4j:5
    container_name: hhh-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_server_directories_import=/import
      - NEO4J_PLUGINS=["graph-data-science"]
      # Public host:port the Browser UI should use when it discovers/opens
      # its bolt-over-websocket connection. The Bolt URI scheme has no path
      # component, so this can't be disambiguated by path the way the HTTP
      # UI is (below) — it needs its own port, not its own subdomain: same
      # $DOMAIN, dedicated entrypoint (see proxy service's neo4jbolt
      # entrypoint + ports: mapping).
      - NEO4J_dbms_connector_http_advertised__address=${DOMAIN}:443
      - NEO4J_dbms_connector_bolt_advertised__address=${DOMAIN}:${NEO4J_BOLT_PORT:-7687}
    # No host ports published directly on this service: app still reaches it
    # over the internal hhh-proxy network at bolt://neo4j:7687, and the proxy
    # service is what publishes the public bolt port. The Browser UI +
    # bolt-over-websocket ARE reachable publicly via Traefik (TLS-terminated,
    # basic-auth gated — see labels below) at https://$DOMAIN/neo4j/browser/.
    #
    # Known limitation of serving Browser under a path prefix: its service
    # discovery document at / returns ABSOLUTE URLs built from the request
    # host (e.g. https://$DOMAIN/db/{db}/query/v2) with no /neo4j prefix, so
    # auto-discovery points at paths this router doesn't own. Browser's own
    # queries go over bolt, not those URLs, so it still works — just enter
    # the connect URL by hand: bolt://$DOMAIN:${NEO4J_BOLT_PORT:-7687}. A
    # dedicated subdomain (neo4j.$DOMAIN) is the only way to fix this
    # properly, since Browser assumes it owns the origin root.
    # Raw TCP bolt for native drivers (cypher-shell, Neo4j Desktop, etc.
    # connecting from outside the Docker network, not through a browser) is
    # intentionally NOT exposed — that needs Neo4j to terminate its own TLS
    # (a separate cert-provisioning project), not just a Traefik route, and
    # nothing here needs it yet.
    #
    # Loopback-only publish for admin SSH tunnels. Bound to 127.0.0.1 (NOT
    # 0.0.0.0), so these are reachable only from the server's own localhost —
    # i.e. only through an SSH tunnel, never from the internet (independent of
    # the perimeter firewall). Distinct host ports (17474/17687) avoid clashing
    # with Traefik's public 0.0.0.0:7687. This gives the tunnel a STABLE target
    # so admins don't have to chase the container's changing bridge IP:
    #   ssh -L 7474:localhost:17474 -L 7687:localhost:17687 <user>@<server>
    #   then open http://localhost:7474 and connect to bolt://localhost:7687
    #   (serving Browser over http avoids the HTTPS->ws:// mixed-content block).
    # See docs/runbook.md "Connecting to Neo4j Browser".
    ports:
      - '127.0.0.1:17474:7474'
      - '127.0.0.1:17687:7687'
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/neo4j/import:/import:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:7474']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      # Browser UI — Neo4j serves its own app at /browser/, matching what's
      # left after Traefik strips /neo4j.
      - traefik.http.routers.neo4j.rule=Host(`${DOMAIN}`) && PathPrefix(`/neo4j`)
      - traefik.http.routers.neo4j.entrypoints=websecure
      - traefik.http.routers.neo4j.tls.certresolver=letsencrypt
      - traefik.http.routers.neo4j.service=neo4j-http
      - traefik.http.services.neo4j-http.loadbalancer.server.port=7474
      - traefik.http.middlewares.neo4j-strip.stripprefix.prefixes=/neo4j
      # The TRAILING SLASH is load-bearing. Neo4j answers /browser with a
      # 301 to the absolute path /browser/ — which has already lost the
      # /neo4j prefix Traefik stripped, so the browser follows it to
      # $DOMAIN/browser/, misses this router's PathPrefix, falls through to
      # the app catch-all and 404s. Requesting /neo4j/browser/ directly
      # returns 200 with no redirect at all. This middleware normalises the
      # bare forms (/neo4j, /neo4j/, /neo4j/browser) up front so a
      # hand-typed URL can't trip the 301. It must run BEFORE neo4j-strip,
      # while the prefix is still on the path.
      - traefik.http.middlewares.neo4j-slash.redirectregex.regex=^(https?://[^/]+)/neo4j(/browser)?/?$$
      - traefik.http.middlewares.neo4j-slash.redirectregex.replacement=$${1}/neo4j/browser/
      # HTTP Browser UI is gated by Keycloak SSO (admin role) — see oauth2-proxy.
      # SSO runs before the slash-normalise/strip so unauthenticated users are
      # redirected to Keycloak first.
      - traefik.http.routers.neo4j.middlewares=sso-auth,neo4j-slash,neo4j-strip
      # Bolt-over-websocket, used by the Browser UI itself to run queries —
      # lives on the dedicated neo4jbolt entrypoint (see proxy service), so a
      # bare Host rule with no path is safe: nothing else listens there.
      # NOT SSO-gated: bolt is a raw TCP/websocket stream, not HTTP, so
      # forward-auth can't apply — it authenticates with Neo4j's own
      # username/password (NEO4J_AUTH) at the bolt-protocol level instead.
      - traefik.http.routers.neo4j-bolt.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.neo4j-bolt.entrypoints=neo4jbolt
      - traefik.http.routers.neo4j-bolt.tls.certresolver=letsencrypt
      - traefik.http.routers.neo4j-bolt.service=neo4j-bolt
      - traefik.http.services.neo4j-bolt.loadbalancer.server.port=7687
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  keycloak-db:
    image: postgres:16-alpine
    container_name: hhh-keycloak-db
    restart: always
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KC_DB_USERNAME:-keycloak}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    networks:
      - hhh-proxy
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KC_DB_USERNAME:-keycloak} -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: hhh-keycloak
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      # Realm import substitutes ${DOMAIN} in the hhh-admin client redirect URIs
      # (https://${DOMAIN}/admin/*); without DOMAIN in the container env it would
      # import literally and every OAuth callback would fail "Invalid redirect_uri".
      - DOMAIN=${DOMAIN}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_PROXY_HEADERS=xforwarded
      # Pin the public address so the OIDC discovery document and the `iss`
      # claim Keycloak stamps on tokens always agree. Without it Keycloak
      # derives both per-request, so fetching
      # /auth/realms/hhh/.well-known/openid-configuration over the internal
      # Docker hostname advertises issuer=http://keycloak:8080/auth/realms/hhh
      # while issued tokens carry https://<domain>/auth/realms/hhh — the
      # discrepancy that made the admin's KEYCLOAK_ISSUER look right while
      # failing openid-client's iss validation (error=OAuthCallback).
      # KC_HOSTNAME_STRICT=false keeps internal calls (Host: keycloak:8080)
      # working; nothing relies on discovery returning internal URLs, since the
      # admin and backend configure their endpoints explicitly.
      #
      # MUST include /auth: KC_HOSTNAME defines the ENTIRE public base URL and
      # KC_HTTP_RELATIVE_PATH is NOT appended to it. Setting it without the path
      # yields issuer=https://<domain>/realms/hhh (no /auth), which breaks the
      # admin's iss validation and the public URLs Traefik routes on PathPrefix(/auth).
      - KC_HOSTNAME=https://${DOMAIN}/auth
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      # Identity register — OFF unless a verified-identity study is running.
      - BACKUP_INCLUDE_IDENTITY=${BACKUP_INCLUDE_IDENTITY:-false}
      - IDENTITY_DB_USERNAME=${IDENTITY_DB_USERNAME:-identity}
      - IDENTITY_DB_PASSWORD=${IDENTITY_DB_PASSWORD:-}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
    command: start --import-realm --health-enabled=true
    networks:
      - hhh-proxy
      # Reaches identity-service (verified-identity studies); see hhh-identity-edge.
      - hhh-identity-edge
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/keycloak/hhh-realm.json:/opt/keycloak/data/import/hhh-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      config-sync:
        condition: service_completed_successfully
    healthcheck:
      # The Keycloak 26 image (ubi9-micro) has no curl — probe the management
      # port (9000) with bash's built-in /dev/tcp instead.
      # NOTE: KC_HTTP_RELATIVE_PATH=/auth moves the management health endpoints
      # under /auth, so the path is /auth/health/ready (not /health/ready — that
      # returns 404 here, unlike docker-compose.local.yml which sets no relative
      # path).
      test:
        [
          'CMD-SHELL',
          "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`${DOMAIN}`) && PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt
      - traefik.http.routers.keycloak.service=keycloak
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: hhh-keycloak-init
    restart: 'no'
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      # The bootstrap script below reads these from the container environment —
      # explicit interpolation so Portainer UI variables reach it (see the
      # env_file note above).
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - HHH_ADMIN_USER=${HHH_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_UI_CLIENT_SECRET=${KEYCLOAK_ADMIN_UI_CLIENT_SECRET}
      - KEYCLOAK_ROPC_CLIENT_SECRET=${KEYCLOAK_ROPC_CLIENT_SECRET}
      - GRAFANA_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      # Used to build the oauth2-proxy client's redirect URI when creating it
      # (see the create-if-missing branch in the bootstrap script below).
      - DOMAIN=${DOMAIN}
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/keycloak/hhh-user-profile.json:/opt/keycloak/bootstrap/hhh-user-profile.json:ro
    networks:
      - hhh-proxy
    depends_on:
      keycloak:
        condition: service_healthy
      config-sync:
        condition: service_completed_successfully
    entrypoint: ['/bin/sh', '-lc']
    command: >
      'until /opt/keycloak/bin/kcadm.sh config credentials
      --server http://keycloak:8080/auth
      --realm master
      --user "$$KEYCLOAK_ADMIN"
      --password "$$KEYCLOAK_ADMIN_PASSWORD";
      do sleep 2; done &&
      /opt/keycloak/bin/kcadm.sh update realms/hhh -s offlineSessionIdleTimeout=15552000 -s offlineSessionMaxLifespanEnabled=false &&
      /opt/keycloak/bin/kcadm.sh update users/profile -r hhh -f /opt/keycloak/bootstrap/hhh-user-profile.json &&
      for R in identity-manager study-nurse monitor; do
        /opt/keycloak/bin/kcadm.sh create roles -r hhh -s name=$$R 2>/dev/null || true;
      done &&
      BACKEND_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-backend --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$BACKEND_ID -r hhh -s secret="$$KEYCLOAK_ADMIN_CLIENT_SECRET" &&
      ADMIN_UI_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-admin --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ADMIN_UI_ID -r hhh -s secret="$$KEYCLOAK_ADMIN_UI_CLIENT_SECRET" &&
      ROPC_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-ropc --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ROPC_ID -r hhh -s secret="$$KEYCLOAK_ROPC_CLIENT_SECRET" &&
      GRAFANA_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=grafana --fields id --format csv --noquotes) &&
      if [ -n "$$GRAFANA_ID" ]; then
        /opt/keycloak/bin/kcadm.sh update clients/$$GRAFANA_ID -r hhh -s secret="$$GRAFANA_CLIENT_SECRET";
      else
        echo "WARNING: grafana client not found — recreate the Keycloak volume (or add the client) so the realm re-imports it" >&2;
      fi &&
      OAUTH2_PROXY_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=oauth2-proxy --fields id --format csv --noquotes) &&
      if [ -n "$$OAUTH2_PROXY_ID" ]; then
        /opt/keycloak/bin/kcadm.sh update clients/$$OAUTH2_PROXY_ID -r hhh -s secret="$$OAUTH2_PROXY_CLIENT_SECRET";
      else
        echo "oauth2-proxy client missing — creating it (the realm was first imported before this client existed; recreating the volume is NOT needed)" >&2 &&
        /opt/keycloak/bin/kcadm.sh create clients -r hhh -s clientId=oauth2-proxy -s enabled=true -s protocol=openid-connect -s publicClient=false -s standardFlowEnabled=true -s serviceAccountsEnabled=false -s "redirectUris=[\"https://$$DOMAIN/oauth2/callback\"]" -s "webOrigins=[\"https://$$DOMAIN\"]" -s secret="$$OAUTH2_PROXY_CLIENT_SECRET";
      fi &&
      SA_ID=$$(/opt/keycloak/bin/kcadm.sh get clients/$$BACKEND_ID/service-account-user -r hhh --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$SA_ID --cclientid realm-management --rolename realm-admin &&
      HHH_ADMIN_USER="$${HHH_ADMIN_USER:-$$KEYCLOAK_ADMIN}" &&
      HHH_ADMIN_ID=$$(/opt/keycloak/bin/kcadm.sh get users -r hhh -q username=$$HHH_ADMIN_USER -q exact=true --fields id --format json 2>/dev/null | grep -o "\"id\" *: *\"[^\"]*\"" | head -n1 | grep -o "\"[^\"]*\"$$" | tr -d "\"") &&
      if [ -z "$$HHH_ADMIN_ID" ]; then
        echo "Creating HHH admin user: $$HHH_ADMIN_USER" &&
        /opt/keycloak/bin/kcadm.sh create users -r hhh -s username="$$HHH_ADMIN_USER" -s enabled=true -s emailVerified=true &&
        HHH_ADMIN_ID=$$(/opt/keycloak/bin/kcadm.sh get users -r hhh -q username=$$HHH_ADMIN_USER -q exact=true --fields id --format json 2>/dev/null | grep -o "\"id\" *: *\"[^\"]*\"" | head -n1 | grep -o "\"[^\"]*\"$$" | tr -d "\"");
      fi &&
      if [ -z "$$HHH_ADMIN_ID" ]; then
        echo "ERROR: could not create or find HHH admin user $$HHH_ADMIN_USER" >&2 && exit 1;
      fi &&
      /opt/keycloak/bin/kcadm.sh set-password -r hhh --userid $$HHH_ADMIN_ID --new-password "$$KEYCLOAK_ADMIN_PASSWORD" --temporary=false &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$HHH_ADMIN_ID --rolename admin &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$HHH_ADMIN_ID --rolename researcher &&
      echo "HHH admin user $$HHH_ADMIN_USER provisioned successfully (id=$$HHH_ADMIN_ID)"'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: hhh-redis
    restart: always
    networks:
      - hhh-proxy
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      # Password is interpolated by docker-compose at parse time, same as
      # in `command:` above — visible via `docker inspect`, no worse than
      # the existing exposure there.
      test:
        [
          'CMD-SHELL',
          'redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redisinsight:
    image: redis/redisinsight:latest
    container_name: hhh-redisinsight
    restart: always
    environment:
      # RedisInsight explicitly does not support path-rewriting behind a
      # reverse proxy — RI_PROXY_PATH must match the public path exactly and
      # Traefik must forward it unstripped (see labels below), unlike
      # lightrag/prometheus/translate which do get stripped.
      - RI_PROXY_PATH=/redisinsight
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      # Pre-populate the connection to the app's own Redis so it's usable
      # immediately after login instead of needing the password pasted in by hand.
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=hhh-redis
      - RI_REDIS_USERNAME=default
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redisinsight-data:/data
    networks:
      - hhh-proxy
    depends_on:
      - redis
    healthcheck:
      # MUST be 127.0.0.1, not localhost. This image's /etc/hosts maps
      # localhost to both 127.0.0.1 and ::1; wget tries the IPv6 address
      # first, but RedisInsight binds IPv4 only — so `localhost` gave a hard
      # "Connection refused" on every path and flapped the container to
      # unhealthy while it was serving perfectly well.
      #
      # /redisinsight (not /) is correct here: RI_PROXY_PATH genuinely
      # remounts the app under that prefix, so / returns 404.
      #
      # NB: a healthy RedisInsight logs only "Running docker-entry.sh" and
      # nothing further — its entrypoint echoes that line then exec's the Node
      # app, which is silent on stdout. That log is NOT a hang.
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:5540/redisinsight',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.redisinsight.rule=Host(`${DOMAIN}`) && PathPrefix(`/redisinsight`)
      - traefik.http.routers.redisinsight.entrypoints=websecure
      - traefik.http.routers.redisinsight.tls.certresolver=letsencrypt
      - traefik.http.routers.redisinsight.service=redisinsight
      - traefik.http.services.redisinsight.loadbalancer.server.port=5540
      # Gated by Keycloak SSO (admin role) — see oauth2-proxy service.
      - traefik.http.routers.redisinsight.middlewares=sso-auth
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  lightrag:
    image: hhh/lightrag
    container_name: hhh-lightrag
    build: ./lightrag
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-alias-ha}
      - LIGHTRAG_LLM_MODEL=${LIGHTRAG_LLM_MODEL:-alias-ha}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - LLM_HEALTH_CHECK_INTERVAL_S=${LLM_HEALTH_CHECK_INTERVAL_S:-120}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      # LLM/embedding credentials — previously .env-file-only (see env_file note).
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://llm.scads.ai/v1}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://llm.scads.ai/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-2560}
      # Public prefix this is served under (see Traefik labels below). LightRAG
      # bakes this into the WebUI's asset/API URLs so the browser's follow-up
      # requests already include /lightrag — Traefik strips it back off before
      # forwarding, same round-trip as the `translate` service further down.
      - LIGHTRAG_API_PREFIX=/lightrag
      # LightRAG's own authentication (replaces the removed Traefik basic-auth).
      # AUTH_ACCOUNTS turns the WebUI's #/login into a real per-user gate and
      # closes the Guest-access hole (without it, a set LIGHTRAG_API_KEY still
      # leaves full API access open to the Guest account). TOKEN_SECRET signs the
      # JWTs it issues after login — must be a stable random secret.
      - AUTH_ACCOUNTS=admin:${LIGHTRAG_AUTH_PASSWORD}
      - TOKEN_SECRET=${LIGHTRAG_TOKEN_SECRET}
    volumes:
      - lightrag-data:/app/data
      # Knowledge corpus — NOT baked into the image and never committed (see
      # lightrag/knowledge/README.md); the documents may be third-party
      # literature we aren't licensed to redistribute, so they must not ship
      # inside a public image.
      #
      # MUST be writable: the WebUI's "upload document" endpoint writes into
      # /app/inputs, so a read-only mount fails with
      # "[Errno 30] Read-only file system" on upload.
      #
      # Defaults to the named volume `lightrag-inputs`, which Docker initialises
      # from the image's /app/inputs — created before the chown in the
      # Dockerfile, so it is owned by the non-root `lightrag` user and is
      # writable (same mechanism as lightrag-data above). Uploads then persist
      # across redeploys.
      #
      # To use a host directory instead, set LIGHTRAG_KNOWLEDGE_DIR to an
      # ABSOLUTE path (e.g. /opt/hhh/knowledge). It must be writable by the
      # container's `lightrag` user, otherwise uploads fail with EACCES —
      # see lightrag/knowledge/README.md.
      - ${LIGHTRAG_KNOWLEDGE_DIR:-lightrag-inputs}:/app/inputs
    networks:
      - hhh-proxy
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-sf',
          '-H',
          'X-API-Key: ${LIGHTRAG_API_KEY}',
          'http://localhost:9621/documents',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.lightrag.rule=Host(`${DOMAIN}`) && PathPrefix(`/lightrag`)
      - traefik.http.routers.lightrag.entrypoints=websecure
      - traefik.http.routers.lightrag.tls.certresolver=letsencrypt
      - traefik.http.routers.lightrag.service=lightrag
      - traefik.http.services.lightrag.loadbalancer.server.port=9621
      - traefik.http.middlewares.lightrag-strip.stripprefix.prefixes=/lightrag
      # LightRAG is deliberately NOT behind the Keycloak SSO gate: it can't do
      # OIDC, and layering Traefik auth in front of its own login is what caused
      # the endless sign-in loop (browser Basic prompt fighting LightRAG's #/login
      # / API 401s). Instead LightRAG uses its OWN auth — AUTH_ACCOUNTS +
      # TOKEN_SECRET on the service below — which is a proper per-user gate and
      # closes the Guest-access hole. So only the prefix strip stays here.
      - traefik.http.routers.lightrag.middlewares=lightrag-strip
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  knowledge-mcp:
    image: hhh/knowledge-mcp
    container_name: hhh-knowledge-mcp
    build: ./knowledge-mcp
    pull_policy: build
    restart: always
    environment:
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://lightrag:9621}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
    networks:
      - hhh-proxy
    depends_on:
      - lightrag
    healthcheck:
      # FastMCP serves SSE, not a plain REST endpoint — a TCP-connect check
      # is a safer liveness probe than GETing the SSE stream path.
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import socket; socket.create_connection(('localhost', 8002), timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  recommender:
    image: hhh/recommender
    container_name: hhh-recommender
    build: ./API-service
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - API_SERVICE_SECRET=${API_SERVICE_SECRET}
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://lightrag:9621}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY}
      - MONGO_HOST=mongo
      - MONGO_DB=surveyjs
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Speech-to-text model alias for habit-donation voice input — reuses
      # the same SCADS.AI credentials as LLM_MODEL (LLM_API_KEY/LLM_API_BASE,
      # supplied via env_file: stack.env/.env above), just a different alias.
      - LLM_STT_MODEL=${LLM_STT_MODEL:-alias-stt}
    networks:
      - hhh-proxy
    depends_on:
      redis:
        condition: service_started
      lightrag:
        condition: service_started
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  admin:
    image: hhh/admin
    container_name: hhh-admin
    pull_policy: build
    build:
      context: ./admin
      # NEXT_PUBLIC_* vars are inlined into the client bundle at `next build`
      # time — they must be passed as build args, not just runtime
      # `environment:` (which has no effect on an already-built image). Kept
      # in sync with the values below.
      args:
        NEXT_PUBLIC_NEXTAUTH_URL: https://${DOMAIN}/admin
        NEXT_PUBLIC_KEYCLOAK_BROWSER_URL: https://${DOMAIN}/auth
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_API_DOCS_URL: https://${DOMAIN}/api-docs
        # Inlined by `next build`. Without it here the browser bundle carries
        # `undefined` no matter what the runtime environment says.
        NEXT_PUBLIC_IDENTITY_API_URL: ${NEXT_PUBLIC_IDENTITY_API_URL:-/identity/api}
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-https://${DOMAIN}/grafana}
        NEXT_PUBLIC_MONGO_EXPRESS_URL: https://${DOMAIN}/mongo
        NEXT_PUBLIC_LIGHTRAG_WEBUI_URL: https://${DOMAIN}/lightrag/webui
        NEXT_PUBLIC_PROMETHEUS_URL: https://${DOMAIN}/prometheus
        NEXT_PUBLIC_REDIS_INSIGHT_URL: https://${DOMAIN}/redisinsight
        NEXT_PUBLIC_NEO4J_BROWSER_URL: https://${DOMAIN}/neo4j/browser/
        NEXT_PUBLIC_BULL_BOARD_URL: https://${DOMAIN}/queues
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      # NextAuth v4 with a Next.js basePath (/admin) needs the FULL path to its
      # API here, including /api/auth — otherwise it emits sign-in/callback/CSRF
      # links at /admin/* instead of /admin/api/auth/*, and login loops on
      # /admin/signin?csrf=true. NEXT_PUBLIC_NEXTAUTH_URL stays the app base
      # (/admin) — it's used for post-logout redirects, not NextAuth routing.
      - NEXTAUTH_URL=https://${DOMAIN}/admin/api/auth
      - NEXT_PUBLIC_NEXTAUTH_URL=https://${DOMAIN}/admin
      - NEXT_PUBLIC_KEYCLOAK_BROWSER_URL=https://${DOMAIN}/auth
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api/v1
      - NEXT_PUBLIC_API_DOCS_URL=https://${DOMAIN}/api-docs
      # Inlined at `next build` — a runtime-only value would stay
      # undefined in the browser. Must be in BOTH build args and env.
      - NEXT_PUBLIC_IDENTITY_API_URL=${NEXT_PUBLIC_IDENTITY_API_URL:-/identity/api}
      - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-https://${DOMAIN}/grafana}
      - NEXT_PUBLIC_MONGO_EXPRESS_URL=https://${DOMAIN}/mongo
      - NEXT_PUBLIC_LIGHTRAG_WEBUI_URL=https://${DOMAIN}/lightrag/webui
      - NEXT_PUBLIC_PROMETHEUS_URL=https://${DOMAIN}/prometheus
      - NEXT_PUBLIC_REDIS_INSIGHT_URL=https://${DOMAIN}/redisinsight
      - NEXT_PUBLIC_NEO4J_BROWSER_URL=https://${DOMAIN}/neo4j/browser/
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_CLIENT_ID=hhh-admin
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_ADMIN_UI_CLIENT_SECRET}
      # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so EVERY realm endpoint
      # lives under /auth — including the server-to-server token/userinfo/JWKS
      # calls the admin makes over the internal Docker hostname. Omitting /auth
      # makes the token exchange 404 and NextAuth fails with
      # `error=OAuthCallback` after Keycloak has already authenticated the user.
      #
      # KEYCLOAK_ISSUER must be the PUBLIC url even though token/userinfo/JWKS
      # are fetched internally: Keycloak stamps `iss` from the frontend request
      # context (the browser flow through Traefik), not from the endpoint that
      # mints the token. Using the internal form fails with
      # `iss mismatch, expected http://keycloak:8080/auth/realms/hhh,
      #  got: https://<domain>/auth/realms/hhh`.
      # NOTE: the internal discovery document advertises the *internal* issuer —
      # do not trust it here; the issued token is what counts.
      - KEYCLOAK_ISSUER=https://${DOMAIN}/auth/realms/hhh
      - KEYCLOAK_BROWSER_URL=https://${DOMAIN}/auth
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
    networks:
      - hhh-proxy
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${DOMAIN}`) && PathPrefix(`/admin`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls.certresolver=letsencrypt
      - traefik.http.routers.admin.service=admin
      - traefik.http.services.admin.loadbalancer.server.port=3001
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Static marketing site (Astro, see website/), self-hosted here instead of
  # on Cloudflare Pages — its domain's registrar won't let its nameservers
  # move off its current DNS provider, so this sidesteps that entirely: it's
  # a second, independent hostname ($WEBSITE_DOMAIN) on the SAME Traefik
  # instance as everything else, needing only an ordinary A/CNAME record
  # (not an NS change) to point at this server. No app code, no env-derived
  # build args — just the static `astro build` output behind nginx.
  website:
    image: hhh/website
    container_name: hhh-website
    pull_policy: build
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: always
    networks:
      - hhh-proxy
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.website.rule=Host(`${WEBSITE_DOMAIN}`) || Host(`www.${WEBSITE_DOMAIN}`)
      - traefik.http.routers.website.entrypoints=websecure
      - traefik.http.routers.website.tls.certresolver=letsencrypt
      - traefik.http.routers.website.service=website
      - traefik.http.services.website.loadbalancer.server.port=4321
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Internal-only reachability prober for services with no native Prometheus
  # metrics — no host mounts, no elevated privileges (unlike e.g. cAdvisor),
  # just outbound TCP-connect/HTTP-GET probes against the same internal
  # hostnames every other service already talks to on hhh-proxy. Feeds the
  # Grafana "service unreachable" alert rule — see docs/runbook.md.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hhh-blackbox-exporter
    restart: always
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9115/-/healthy',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: hhh-prometheus
    restart: always
    networks:
      - hhh-proxy
    depends_on:
      config-sync:
        condition: service_completed_successfully
    volumes:
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # web.external-url fixes relative links generated by the UI (so they
      # point at /prometheus/...); web.route-prefix is deliberately left
      # unprefixed (/) so Prometheus's own internal routes — including
      # /-/healthy below — stay unprefixed too. Traefik strips /prometheus
      # before forwarding, so what Prometheus sees never has the prefix.
      - --web.external-url=https://${DOMAIN}/prometheus
      - --web.route-prefix=/
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9090/-/healthy',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`${DOMAIN}`) && PathPrefix(`/prometheus`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
      - traefik.http.routers.prometheus.service=prometheus
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - traefik.http.middlewares.prometheus-strip.stripprefix.prefixes=/prometheus
      # Gated by Keycloak SSO (admin role) — see oauth2-proxy service. SSO runs
      # before the prefix strip so unauthenticated users hit Keycloak first.
      - traefik.http.routers.prometheus.middlewares=sso-auth,prometheus-strip
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  grafana:
    image: grafana/grafana-oss:12.0.1
    container_name: hhh-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # ── Keycloak SSO (generic OAuth) ─────────────────────────────────────
      # Browser-facing endpoints use the public https://${DOMAIN}/auth URL so
      # the token issuer matches; the "grafana" realm client secret is injected
      # into Keycloak by keycloak-init from GRAFANA_CLIENT_SECRET.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile roles
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${DOMAIN}/auth/realms/hhh/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://${DOMAIN}/auth/realms/hhh/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://${DOMAIN}/auth/realms/hhh/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      # Map Keycloak realm roles -> Grafana roles (admin=Admin, researcher=Editor, else Viewer).
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'researcher') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      # Let users click straight through to Keycloak instead of the local login form.
      - GF_AUTH_OAUTH_AUTO_LOGIN=false
      # ── SMTP (critical-alert emails) ─────────────────────────────────────
      # Same generic SMTP_* credentials used by backup.sh and API-service's
      # alerting.py — one transport, one recipient (see .env.example's "Mail
      # (generic SMTP)" section). Static env vars only, no bootstrap-ordering
      # dependency: unlike keycloak-init, nothing needs to wait for Grafana to
      # be healthy first — Grafana reads these at its own startup.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT:-587}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASS}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-noreply@example.com}
      - GF_SMTP_FROM_NAME=Health Habit Hub Alerts
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      # Contact-point recipient for the provisioned alert rules (see
      # monitoring/grafana/provisioning/alerting/alerting.yaml).
      - HHH_ALERT_EMAIL=${ALERT_EMAIL:-}
    networks:
      - hhh-proxy
    volumes:
      - grafana-data:/var/lib/grafana
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard provider (provisioning/dashboards/dashboard.yml) reads JSON
      # from /etc/grafana/dashboards — mount it, or Grafana logs a repeating
      # "stat /etc/grafana/dashboards: no such file or directory" every 10s.
      - ${HHH_REPO_DIR:-/opt/hhh/repo}/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      config-sync:
        condition: service_completed_successfully
    healthcheck:
      # GF_SERVER_SERVE_FROM_SUB_PATH=true means the API is mounted under
      # /grafana internally too, not just at the public router path.
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/grafana/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${DOMAIN}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backup:
    image: hhh/backup
    container_name: hhh-backup
    build: ./backup-service
    pull_policy: build
    restart: always
    env_file:
      # Portainer repository deploys have no .env in the checkout; UI variables
      # are substitution-only. stack.env (in the repo) supplies non-secret
      # defaults; a local .env (dev / manual server deploys) overrides it.
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - OFFSITE_REMOTE=${OFFSITE_REMOTE:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - BACKUP_EMAIL=${BACKUP_EMAIL:-}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      # Reachable directly over hhh-proxy (pg_dump/psql connect over the network
      # to the running server — unlike Neo4j's offline neo4j-admin dump, no
      # docker-socket-proxy access is needed for the Keycloak DB backup/restore).
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      # Keycloak runs under /auth in prod (KC_HTTP_RELATIVE_PATH=/auth below) —
      # backup.sh/restore.sh's realm export/import and admin-token calls need
      # this full base URL, matching the app service's KEYCLOAK_URL above.
      - KEYCLOAK_URL=http://keycloak:8080/auth
      # Internal-only HTTP API used by the admin panel's Backups page
      # (status/trigger/restore/upload) — never published to the host, only
      # reachable from other containers on hhh-proxy.
      - BACKUP_API_SECRET=${BACKUP_API_SECRET}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-2048}
      # docker.sock is never mounted directly into this container (that would
      # be root-equivalent host access) — the docker CLI talks to the scoped
      # docker-socket-proxy below instead, reachable only on the
      # hhh-backup-internal network.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ${HHH_DATA_DIR:-/opt/hhh/data}/backups:/backups
      # If OFFSITE_REMOTE is set: this container now runs backup.sh/restore.sh
      # as a non-root user (docker-entrypoint.sh chowns /backups on start, but
      # cannot chown this read-only mount) — ensure these files are readable
      # by "other" on the host, e.g. `chmod -R o+r /opt/hhh/data/rclone`.
      - ${HHH_DATA_DIR:-/opt/hhh/data}/rclone:/config/rclone:ro
      - lightrag-data:/lightrag:ro
      - audio-recordings-data:/audio:ro
    networks:
      - hhh-proxy
      - hhh-backup-internal
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      lightrag:
        condition: service_started
      keycloak-db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    # Also starts the internal backup-api HTTP server (see backup-service/api/)
    # used by the admin panel. The schedule itself is a sleep loop, not real
    # cron — see docs/runbook.md — so "next backup" drifts by up to a few
    # minutes on every restart of this container.
    command: /bin/bash -c "node /backup-api/server.js & echo 'Waiting 2 minutes for services to stabilize...'; sleep 120; while true; do BACKUP_TRIGGER=scheduled /backup.sh; sleep 86400; done"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4100/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Scoped proxy in front of the real docker.sock — only the backup
  # container can reach it (hhh-backup-internal is not joined by anything
  # else), and it exposes only the container/volume/image lifecycle calls
  # backup.sh / restore.sh actually issue (start/stop/create/run for the
  # neo4j-admin dump sidecar). EXEC, NETWORKS, SWARM, SECRETS, NODES,
  # PLUGINS, SERVICES, CONFIGS, BUILD, COMMIT, SESSION and AUTH stay
  # disabled, so a compromised backup-api can no longer exec into or
  # reconfigure arbitrary unrelated containers.
  # NOTE: POST+CONTAINERS+VOLUMES together still allow creating a container
  # with an arbitrary bind mount, which is inherently root-equivalent — this
  # narrows the blast radius (network isolation + reduced API surface) but
  # does not eliminate it. A full fix would replace `docker run
  # --volumes-from hhh-neo4j` in backup.sh/restore.sh with `docker exec`
  # into the already-running neo4j container so no socket access is needed
  # at all; that's a larger change tracked separately.
  # No healthcheck: this image is a minimal, security-hardened Go binary with
  # no shell/curl/wget/python available to probe it with, by design (smaller
  # attack surface). `backup`'s `depends_on: condition: service_started`
  # above is the extent of orchestration that makes sense here.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: hhh-docker-socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - VOLUMES=1
      - IMAGES=1
      - POST=1
      - EXEC=0
      - NETWORKS=0
      - SWARM=0
      - SERVICES=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - CONFIGS=0
      - BUILD=0
      - COMMIT=0
      - SESSION=0
      - AUTH=0
      - DISTRIBUTION=0
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - hhh-backup-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── Identity register (verified-identity studies only) ────────────────────
  # Holds the subject-code <-> person mapping, encrypted, in its OWN database.
  # See docs/identity-mode-plan.md and identity-service/README.md.
  #
  # Deploy is OPTIONAL: with no study in verified mode nothing calls it, and
  # `identity.mode` is absent (=> anonymous) on every existing study.
  identity-db:
    image: postgres:16-alpine
    container_name: hhh-identity-db
    restart: always
    profiles: ['identity']
    environment:
      - POSTGRES_DB=identity
      - POSTGRES_USER=${IDENTITY_DB_USERNAME:-identity}
      - POSTGRES_PASSWORD=${IDENTITY_DB_PASSWORD}
    networks:
      # PRIVATE ONLY. Deliberately not on hhh-proxy: nothing but the identity
      # service may reach this database, and it must never be routable.
      - hhh-identity-net
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${IDENTITY_DB_USERNAME:-identity} -d identity']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  identity-service:
    build:
      context: ./identity-service
    image: hhh/identity-service
    container_name: hhh-identity
    restart: always
    profiles: ['identity']
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - IDENTITY_DB_URL=postgres://${IDENTITY_DB_USERNAME:-identity}:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      # Mounted as a FILE, never an env var: env leaks via docker inspect,
      # /proc/<pid>/environ and crash dumps. The service refuses to start with
      # an inline key when NODE_ENV=production.
      - IDENTITY_MASTER_KEY_FILE=/run/secrets/identity-master-key
      - IDENTITY_KEK_VERSION=${IDENTITY_KEK_VERSION:-1}
      - IDENTITY_BI_VERSION=${IDENTITY_BI_VERSION:-1}
      - IDENTITY_SERVICE_SECRET=${IDENTITY_SERVICE_SECRET}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL}
      - KEYCLOAK_ISSUER=${KEYCLOAK_JWT_ISSUER}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_JWT_AUDIENCE:-}
      - SMTP_HOST=${IDENTITY_SMTP_HOST:-}
      - SMTP_PORT=${IDENTITY_SMTP_PORT:-587}
      - SMTP_USER=${IDENTITY_SMTP_USER:-}
      - SMTP_PASS=${IDENTITY_SMTP_PASS:-}
      - SMTP_FROM=${IDENTITY_SMTP_FROM:-}
    volumes:
      # 0400 on the host. Read-only here.
      - ${HHH_DATA_DIR:-/opt/hhh/data}/identity-master-key:/run/secrets/identity-master-key:ro
    networks:
      # NOT on hhh-proxy. That network is flat — everything in the stack joins
      # it — so being on it would give the register a route to mongo and neo4j.
      # This list IS the control; a CI check asserts it stays this way.
      - hhh-identity-edge
      - hhh-identity-net
    healthcheck:
      # Probes the INTERNAL port: if that is not answering, HHH cannot enrol
      # anyone, which is the failure that actually matters.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3003/internal/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - 'traefik.enable=true'
      # Admin-portal traffic only. The internal API on :3003 has NO label and
      # is therefore unreachable from outside the Docker network.
      - 'traefik.http.routers.identity.rule=Host(`${DOMAIN}`) && PathPrefix(`/identity`)'
      - 'traefik.http.routers.identity.entrypoints=websecure'
      - 'traefik.http.routers.identity.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.identity.middlewares=identity-strip,identity-ratelimit'
      - 'traefik.http.middlewares.identity-strip.stripprefix.prefixes=/identity'
      - 'traefik.http.middlewares.identity-ratelimit.ratelimit.average=60'
      - 'traefik.http.middlewares.identity-ratelimit.ratelimit.burst=30'
      - 'traefik.http.services.identity.loadbalancer.server.port=3002'
      # REQUIRED. Traefik is started with --providers.docker.network=hhh-proxy,
      # and this service is deliberately NOT on that network, so without this
      # override Traefik would look for an IP it cannot find and routing to
      # /identity would silently fail.
      - 'traefik.docker.network=hhh-identity-edge'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  hhh-proxy:
    name: hhh-proxy
  hhh-backup-internal:
    name: hhh-backup-internal
    internal: true
  # Private: identity-service <-> identity-db only. Nothing else joins it,
  # which makes "the register cannot reach the research databases" a property
  # of the network rather than of application code.
  hhh-identity-net:
    name: hhh-identity-net
    internal: true
  # Carries ONLY the traffic the register legitimately needs: Traefik (admin
  # portal), Keycloak (JWKS) and the HHH backend (the internal enrolment API).
  # identity-service is deliberately NOT on hhh-proxy, because that network is
  # flat and would give it a path to mongo and neo4j.
  hhh-identity-edge:
    name: hhh-identity-edge

volumes:
  traefik-certs:
    name: hhh-traefik-certs
  mongo-data:
    name: hhh-mongo-data
  mongo-config:
    name: hhh-mongo-config
  neo4j-data:
    name: hhh-neo4j-data
  neo4j-logs:
    name: hhh-neo4j-logs
  keycloak-db-data:
    name: hhh-keycloak-db-data
  identity-db-data:
    name: hhh-identity-db-data
  redis-data:
    name: hhh-redis-data
  redisinsight-data:
    name: hhh-redisinsight-data
  lightrag-data:
    name: hhh-lightrag-data
  # Uploaded / staged knowledge documents (mounted at /app/inputs). Kept out of
  # the image and out of git; see lightrag/knowledge/README.md.
  lightrag-inputs:
    name: hhh-lightrag-inputs
  prometheus-data:
    name: hhh-prometheus-data
  grafana-data:
    name: hhh-grafana-data
  # Recorded audio clips from habit-donation voice input, mounted into the
  # app container at AUDIO_STORAGE_DIR. Kept out of the image and out of
  # git — see docs/data-model.md's habit_donations collection.
  audio-recordings-data:
    name: hhh-audio-recordings-data
