org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# All resolved plugins now support AGP 9 built-in Kotlin. Keep explicit flags
# so Flutter's legacy-project migrator does not opt this project back out.
android.builtInKotlin=true
# Flutter 3.47 still uses legacy AGP extension types; this is independent
# of the Kotlin compiler mode above.
android.newDsl=false
