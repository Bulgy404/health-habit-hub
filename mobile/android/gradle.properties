org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Built-in Kotlin stays off. AGP 9 defaults it on and Flutter would prefer it,
# but five plugins in this app's dependency tree still apply the Kotlin Gradle
# Plugin themselves (flutter_timezone, sentry_flutter, shared_preferences_android,
# url_launcher_android, webview_flutter_android), and AGP refuses to have both.
# Revisit when those plugins have migrated; until then this is not ours to fix.
android.builtInKotlin=false

# newDsl left at AGP 9's own default (true) by omission. Flutter's Gradle
# migrator re-adds `android.newDsl=false` here on some builds — it is wrong for
# AGP 9 and makes app/build.gradle.kts fail to compile, because the android{}
# block then resolves to the deprecated BaseAppModuleExtension and AGP 9 treats
# that deprecation as an error. If a build suddenly fails on "Line 28: android {",
# check whether that line has come back.
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
