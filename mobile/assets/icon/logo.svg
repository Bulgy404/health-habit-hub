<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- Green gradient: lighter top-left → darker bottom-right -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5CD400"/>
      <stop offset="100%" stop-color="#1D7800"/>
    </linearGradient>

    <!-- Subtle radial shine: soft white bloom top-left -->
    <radialGradient id="shine" cx="28%" cy="22%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for the heart -->
    <filter id="heart-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="22"
                    flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="icon-clip">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>

  </defs>

  <!-- ── Background ─────────────────────────────────────────────────────────── -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-grad)"/>
  <!-- Shine overlay -->
  <rect width="1024" height="1024" rx="224" fill="url(#shine)"/>

  <!-- ── Heart mark ─────────────────────────────────────────────────────────── -->
  <!--
    Parametric heart — centred at (512, 488) for visual balance.
    Tip at bottom (y≈718), lobe peaks at top (y≈256).
    Width ≈ 580 px, Height ≈ 462 px.
  -->
  <g clip-path="url(#icon-clip)" filter="url(#heart-shadow)">
    <path
      d="M 512 718
         C 512 718 224 562 224 388
         C 224 272 308 208 400 208
         C 456 208 512 248 512 280
         C 512 248 568 208 624 208
         C 716 208 800 272 800 388
         C 800 562 512 718 512 718 Z"
      fill="white"
    />
  </g>

  <!-- ── Hub accent: three small dots inside the heart ─────────────────────── -->
  <!--
    Three dots arranged in a downward-pointing triangle at the heart's centre.
    They represent the three H's (Health · Habit · Hub) and reinforce the
    "hub" / connectivity concept without cluttering the mark.
  -->
  <g clip-path="url(#icon-clip)">
    <!-- Top-left dot -->
    <circle cx="452" cy="456" r="34" fill="#2E8C00" fill-opacity="0.30"/>
    <!-- Top-right dot -->
    <circle cx="572" cy="456" r="34" fill="#2E8C00" fill-opacity="0.30"/>
    <!-- Bottom-centre dot -->
    <circle cx="512" cy="548" r="34" fill="#2E8C00" fill-opacity="0.30"/>
    <!-- Centre connecting lines (very subtle) -->
    <line x1="452" y1="456" x2="572" y2="456"
          stroke="#2E8C00" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
    <line x1="452" y1="456" x2="512" y2="548"
          stroke="#2E8C00" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
    <line x1="572" y1="456" x2="512" y2="548"
          stroke="#2E8C00" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
  </g>

</svg>
