name: hhh
description: 'Health Habit Hub - Flutter app for habit donation research'
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  flutter_appauth: ^12.0.0
  flutter_secure_storage: ^11.0.0
  dio: ^5.4.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  fl_chart: ^1.2.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  share_plus: ^13.0.0
  google_fonts: ^8.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  sentry_flutter: ^9.6.0
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.3.5
  package_info_plus: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  http_mock_adapter: ^0.6.1
  webview_flutter_platform_interface: ^2.15.1
  share_plus_platform_interface: ^7.1.0
  plugin_platform_interface: ^2.1.8
  flutter_local_notifications_platform_interface: ^12.0.0

flutter_launcher_icons:
  image_path: 'assets/icon/app_icon.png'
  android: true
  ios: true
  web:
    generate: true
    image_path: 'assets/icon/app_icon.png'
  windows:
    generate: false
  macos:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
