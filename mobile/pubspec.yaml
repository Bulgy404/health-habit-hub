name: hhh
description: "Health Habit Hub - Flutter app for habit donation research"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  flutter_appauth: ^12.0.0
  flutter_secure_storage: ^10.0.0
  dio: ^5.4.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  fl_chart: ^1.2.0
  webview_flutter: ^4.10.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.3.0
  share_plus: ^13.0.0
  google_fonts: ^8.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  http_mock_adapter: ^0.6.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
