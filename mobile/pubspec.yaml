name: hhh
description: "Health Habit Hub - Flutter app for habit donation research"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_appauth: ^8.0.1
  flutter_secure_storage: ^9.2.3
  dio: ^5.4.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  fl_chart: ^0.69.0
  webview_flutter: ^4.10.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
