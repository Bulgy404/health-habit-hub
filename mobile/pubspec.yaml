name: hhh
description: 'Health Habit Hub - Flutter app for habit donation research'
publish_to: 'none'
version: 1.3.1+9

# Android uses AGP 9 built-in Kotlin, supported by Flutter 3.47 and later.
# Flutter 3.47 ships Dart 3.13; keep the declared toolchain floor consistent.
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5
  intl: ^0.20.2

  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  fl_chart: ^1.3.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  google_fonts: ^9.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  sentry_flutter: ^10.3.0
  # Explicit analytics only; configured manually with autocapture/replay and
  # SDK error collection disabled in lib/analytics/analytics_service.dart.
  posthog_flutter: 5.58.4
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  # Habit-donation voice input. record's own hasPermission() requests mic
  # access natively — no separate permission_handler dependency needed.
  record: ^7.1.2
  path_provider: ^2.1.5
  # Device model/platform, sent alongside the FCM token at registration so
  # the admin portal can show a participant's actual devices instead of an
  # anonymous login session.
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  http_mock_adapter: ^0.6.1
  webview_flutter_platform_interface: ^2.15.1
  share_plus_platform_interface: ^7.1.0
  plugin_platform_interface: ^2.1.8
  flutter_local_notifications_platform_interface: ^12.0.0

# Maintained native fixes are regular dependencies so Xcode Build/Archive,
# Flutter CLI and CI all use identical sources. See third_party/README.md.
dependency_overrides:
  device_info_plus:
    path: third_party/device_info_plus-13.3.0
  flutter_appauth:
    path: third_party/flutter_appauth-13.0.0
  record_ios:
    path: third_party/record_ios-2.1.1
  firebase_messaging:
    path: third_party/firebase_messaging-17.0.1
  flutter_local_notifications:
    path: third_party/flutter_local_notifications-22.3.3
  sentry_flutter:
    path: third_party/sentry_flutter-10.3.0
  posthog_flutter:
    path: third_party/posthog_flutter-5.58.4

flutter_launcher_icons:
  image_path: 'assets/icon/app_icon.png'
  android: true
  ios: true
  web:
    generate: true
    image_path: 'assets/icon/app_icon.png'
  windows:
    generate: false
  macos:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
