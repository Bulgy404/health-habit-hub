name: hhh
description: "Health Habit Hub - Flutter app for habit donation research"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  flutter_appauth: 8.0.3
  flutter_secure_storage: 9.2.4
  dio: ^5.4.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  fl_chart: ^0.69.0
  webview_flutter: ^4.10.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
