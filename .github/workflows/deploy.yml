name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Only deploy if triggered by successful CI run on master, or directly by a tag push
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/health-habit-hub
            git pull
            bash scripts/deploy-full.sh

  release:
    name: Build and upload release artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter APK (release)
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web

      - name: Archive Flutter Web build
        run: |
          cd mobile/build/web
          zip -r ../../../flutter-web.zip .

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            flutter-web.zip
          generate_release_notes: true
