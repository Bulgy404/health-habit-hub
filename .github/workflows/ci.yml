name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. BACKEND – lint & format (fast gate, no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend – lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app

      - name: Format
        working-directory: app
        run: npx prettier --write .

      - name: Lint
        working-directory: app
        run: npx eslint .

      - name: Legal documents consistency
        working-directory: app
        run: node scripts/checkLegalDocs.mjs

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BACKEND – unit tests + coverage (no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend – unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app

      - name: Run unit tests with coverage
        working-directory: app
        run: >
          npx c8
          --include='middleware/**'
          --include='controllers/**'
          --include='routes/**'
          --include='services/**'
          --reporter=text
          --reporter=lcov
          node --test "tests/unit/**/*.test.js"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: app/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. BACKEND – integration tests (MongoDB + Neo4j + Fuseki)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend – integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc", "n10s"]'
          NEO4J_apoc_export_file_enabled: "true"
          NEO4J_apoc_import_file_enabled: "true"
          NEO4J_apoc_import_file_use__neo4j__config: "true"
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app

      - name: Run integration tests
        working-directory: app
        env:
          NODE_ENV: test
          MONGO_HOST: localhost
          MONGO_USER: ""
          MONGO_PASSWORD: ""
          MONGO_DB: hhh_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          KEYCLOAK_URL: http://localhost:8080
        run: node --test "tests/integration/**/*.test.js"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. BACKEND – security audit
  # ─────────────────────────────────────────────────────────────────────────────
  backend-security:
    name: Backend – security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. FLUTTER – analyze (fast gate)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Flutter – analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Analyze
        working-directory: mobile
        run: flutter analyze lib/ test/

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. FLUTTER – widget tests + coverage
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-test:
    name: Flutter – widget tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Run all widget tests with coverage
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. FLUTTER – web build (validates the build compiles)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-build-web:
    name: Flutter – build web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Build Flutter web
        working-directory: mobile
        run: flutter build web --release

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. ONTOLOGY – graph integrity tests (Neo4j only)
  # ─────────────────────────────────────────────────────────────────────────────
  ontology-test:
    name: Ontology – graph integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Neo4j HTTP API
        run: |
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until curl -sf -u neo4j:password http://localhost:7474/db/neo4j/tx/commit \
            -H "Content-Type: application/json" \
            -d "{\"statements\":[{\"statement\":\"RETURN 1\"}]}" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if not d[\"errors\"] else 1)" 2>/dev/null; do sleep 3; done'

      - name: Apply constraints
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse
          constraints = open("neo4j/init/constraints.cypher").read()
          # Strip comments and split on semicolons to get individual statements
          stmts = [s.strip() for s in constraints.split(";") if s.strip() and not s.strip().startswith("//")]
          payload = json.dumps({"statements": [{"statement": s} for s in stmts]}).encode()
          req = urllib.request.Request(
              "http://localhost:7474/db/neo4j/tx/commit",
              data=payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          import base64
          req.add_header("Authorization", "Basic " + base64.b64encode(b"neo4j:password").decode())
          with urllib.request.urlopen(req) as r:
              d = json.loads(r.read())
              if d["errors"]:
                  raise SystemExit(f"Constraint errors: {d['errors']}")
          print("Constraints applied.")
          EOF

      - name: Seed minimal test data
        run: |
          python3 - <<'EOF'
          import json, urllib.request, base64

          def cypher(stmts):
              payload = json.dumps({"statements": [{"statement": s} for s in stmts]}).encode()
              req = urllib.request.Request(
                  "http://localhost:7474/db/neo4j/tx/commit",
                  data=payload,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              req.add_header("Authorization", "Basic " + base64.b64encode(b"neo4j:password").decode())
              with urllib.request.urlopen(req) as r:
                  d = json.loads(r.read())
                  if d["errors"]:
                      raise SystemExit(f"Seed error: {d['errors']}")

          cypher([
              "MERGE (:hhh__ExperimentalSetting:hhh__Group1 {uri:'http://example.com/hhh#G1'})",
              "MERGE (:hhh__ExperimentalSetting:hhh__Group2 {uri:'http://example.com/hhh#G2'})",
              "MERGE (:hhh__ExperimentalSetting:hhh__Group3 {uri:'http://example.com/hhh#G3'})",
              "MERGE (:hhh__ExperimentalSetting:hhh__Group4 {uri:'http://example.com/hhh#G4'})",
              "MERGE (:hhh__Donor {uri:'http://example.com/hhh#d1', hhh__userId:'u1', hhh__group:'G1'})",
              "MERGE (:hhh__Habit {uri:'http://example.com/hhh#h1'})",
          ])
          cypher([
              "MATCH (d1:hhh__Donor {uri:'http://example.com/hhh#d1'}), (h1:hhh__Habit {uri:'http://example.com/hhh#h1'}) MERGE (d1)-[:hhh__donates]->(h1)",
              "MATCH (h1:hhh__Habit {uri:'http://example.com/hhh#h1'}), (g1:hhh__Group1 {uri:'http://example.com/hhh#G1'}) MERGE (h1)-[:hhh__partOf]->(g1)",
          ])
          print("Seed data applied.")
          EOF

      - name: Run ontology test suite
        env:
          NEO4J_HTTP: http://localhost:7474
          NEO4J_USER: neo4j
          NEO4J_PASS: password
        run: bash tests/ontology/test-ontology.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. DOCKER – build validation (all four custom images)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker – build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build app (Node.js)
        run: docker build ./app

      - name: Build recommender (Python)
        run: docker build ./API-service

      - name: Build backup-service
        run: docker build ./backup-service

      - name: Build admin (Next.js)
        run: docker build -f admin/Dockerfile -t hhh-admin admin/

  # ─────────────────────────────────────────────────────────────────────────────
  # 10. PYTHON API-SERVICE – pytest
  # ─────────────────────────────────────────────────────────────────────────────
  python-api-test:
    name: Python API-service – tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: API-service/requirements.txt

      - name: Install dependencies
        working-directory: API-service
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: API-service
        env:
          LLM_API_KEY: placeholder
          API_SERVICE_SECRET: test-api-service-secret
        run: pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────────
  # 11. ADMIN – typecheck & build (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  admin-build:
    name: Admin – typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          working-directory: admin

      - name: Typecheck
        working-directory: admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: admin
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # 12. FLUTTER – dependency audit (outdated major versions + graph integrity)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-dependency-audit:
    name: Flutter – dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter

      - name: Verify dependency graph resolves without conflicts
        working-directory: mobile
        run: flutter pub deps

      - name: Check for breaking major-version upgrades in direct dependencies
        # To suppress a specific outdated warning, upgrade intentionally:
        #   flutter pub upgrade --major-versions <package>
        # then commit the updated pubspec.yaml and pubspec.lock.
        working-directory: mobile
        run: |
          flutter pub outdated --json > /tmp/pub_outdated.json
          python3 - <<'EOF'
          import json, sys

          with open("/tmp/pub_outdated.json") as f:
              data = json.load(f)

          breaking = []
          for pkg in data.get("packages", []):
              if pkg.get("kind") != "direct":
                  continue
              current = (pkg.get("current") or {}).get("version")
              resolvable = (pkg.get("resolvable") or {}).get("version")
              if not current or not resolvable:
                  continue
              cur_major = int(current.split(".")[0])
              res_major = int(resolvable.split(".")[0])
              if res_major > cur_major:
                  breaking.append(f"  {pkg['package']}: {current} -> {resolvable}")

          if breaking:
              print("Breaking major-version upgrades available for direct dependencies:")
              print("\n".join(breaking))
              print("Run: flutter pub upgrade --major-versions <package> to upgrade intentionally.")
              sys.exit(1)
          else:
              print("No breaking major-version upgrades found.")
          EOF

  # ─────────────────────────────────────────────────────────────────────────────
  # 13. GATE – all jobs must pass before deploy can proceed
  # ─────────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - backend-lint
      - backend-unit
      - backend-integration
      - backend-security
      - flutter-analyze
      - flutter-test
      - flutter-build-web
      - ontology-test
      - docker-build
      - python-api-test
      - admin-build
      - flutter-dependency-audit
    steps:
      - run: echo "All CI jobs passed."
