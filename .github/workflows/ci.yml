name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel superseded runs on the same ref (PR branch or branch push) to save
# runner minutes. Tag pushes (releases) get their own group so they are never
# cancelled by a later push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. BACKEND – lint & format (fast gate, no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend – lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-app

      - name: Format check
        working-directory: app
        # Use --check (not --write): CI must FAIL on unformatted code, not
        # silently rewrite it (which always passes and defeats the gate).
        run: npx prettier --check .

      - name: Lint
        working-directory: app
        run: npx eslint .

      - name: Legal documents consistency
        working-directory: app
        run: node scripts/checkLegalDocs.mjs

      # Rendering every diagram here would mean a headless Chromium for
      # mermaid-cli. This catches the failure that actually happened instead:
      # two sequence diagrams sat unrenderable for months because of a
      # semicolon in an arrow message, and nothing noticed.
      - name: Diagram consistency
        run: node scripts/checkDiagrams.mjs

      - name: Analytics registry consistency
        run: node scripts/generate-analytics-registry.mjs --check

      - name: OpenAPI spec drift
        working-directory: app
        run: |
          node ../scripts/generate-spec.js
          git diff --exit-code ../docs/api/openapi.yaml || {
            echo "::error::docs/api/openapi.yaml is stale — run 'npm run generate-spec' in app/ and commit the result";
            exit 1;
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BACKEND – unit tests + coverage (no services)
  # ─────────────────────────────────────────────────────────────────────────────
  identity-service-tests:
    name: Identity service – tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # Postgres is here for tests/e2e.routes.test.js only. Everything else uses
    # hand-rolled SQL-shaped fakes, matching the backend's unit-test style —
    # but fakes cannot falsify a four-eyes TRIGGER, a partial unique index, or
    # a RETURNING-based counter under a concurrent second read, and those are
    # precisely the controls this service leans on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: identity-service/package-lock.json

      - name: Install
        working-directory: identity-service
        run: npm ci

      - name: Run tests
        working-directory: identity-service
        env:
          IDENTITY_TEST_DB_URL: postgres://postgres:test@localhost:5432/identity_test
        run: npm test

      # The end-to-end suite skips itself when IDENTITY_TEST_DB_URL is unset,
      # which is right for a developer without Postgres and wrong for CI: a
      # silent skip here would quietly lose the only coverage of the whole
      # chain. Fail the job instead if it did not actually run.
      - name: Assert the end-to-end chain actually ran
        working-directory: identity-service
        env:
          IDENTITY_TEST_DB_URL: postgres://postgres:test@localhost:5432/identity_test
        run: |
          node --test tests/e2e.routes.test.js 2>&1 | tee e2e.log
          if grep -q "IDENTITY_TEST_DB_URL is not set" e2e.log; then
            echo "::error::The end-to-end suite skipped itself in CI — Postgres was not reachable";
            exit 1;
          fi

      - name: Dependency audit
        working-directory: identity-service
        run: npm audit --audit-level=high

  backend-unit:
    name: Backend – unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-app

      - name: Run unit tests with coverage
        working-directory: app
        # tests/roles.test.js and tests/BackupConfiguration.test.js sit
        # directly in tests/ (not tests/unit/) but need no external services,
        # so they belong here rather than in the integration job.
        # --test-force-exit: defense in depth against node --test hanging at
        # exit despite every test passing — see the integration job's note.
        run: >
          npx c8
          --include='middleware/**'
          --include='controllers/**'
          --include='routes/**'
          --include='services/**'
          --reporter=text
          --reporter=lcov
          node --test --test-force-exit "tests/unit/**/*.test.js" tests/roles.test.js tests/BackupConfiguration.test.js

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: backend-unit-coverage
          path: app/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. BACKEND – integration tests (MongoDB + Neo4j)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend – integration tests
    runs-on: ubuntu-latest
    # Without this, a hung run (e.g. a test file's server.close() never
    # completing because a lingering keep-alive connection was left open)
    # burns CI minutes for up to GitHub's 6-hour default instead of failing
    # fast — this happened for real, see the --test-force-exit note below.
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc", "n10s", "graph-data-science"]'
          NEO4J_apoc_export_file_enabled: 'true'
          NEO4J_apoc_import_file_enabled: 'true'
          NEO4J_apoc_import_file_use__neo4j__config: 'true'
          NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,n10s.*,gds.*'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-app

      - name: Run integration tests
        working-directory: app
        env:
          NODE_ENV: test
          MONGO_HOST: localhost
          MONGO_USER: ''
          MONGO_PASSWORD: ''
          MONGO_DB: hhh_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          KEYCLOAK_URL: http://localhost:8080
        # tests/Mongo.test.js sits directly in tests/ (not tests/integration/)
        # but needs the mongodb service above, so it belongs here. It skips
        # itself gracefully if Mongo is unreachable.
        #
        # --test-force-exit: a real CI run hung for 20+ minutes after the
        # last test in habits.routes.test.js (root cause: that file's
        # server.close() never completed because a lingering keep-alive
        # connection was still open — fixed via server.closeAllConnections()
        # across every integration test file). This flag is defense in
        # depth against the same class of issue recurring elsewhere.
        run: node --test --test-force-exit "tests/integration/**/*.test.js" tests/Mongo.test.js

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. BACKEND – security audit
  # ─────────────────────────────────────────────────────────────────────────────
  backend-security:
    name: Backend – security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-app

      - name: Audit backend dependencies
        working-directory: app
        run: npm audit --audit-level=critical

      # npm audit reads package-lock.json directly — no install needed for admin.
      - name: Audit admin dependencies
        working-directory: admin
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────────────────────────────────────
  # 4b. PYTHON – dependency audit (API-service + knowledge-mcp)
  # ─────────────────────────────────────────────────────────────────────────────
  python-security:
    name: Python – dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit each service's pinned requirements against the PyPI advisory DB.
      - name: Audit API-service dependencies
        run: pip-audit -r API-service/requirements.txt

      - name: Audit knowledge-mcp dependencies
        run: pip-audit -r knowledge-mcp/requirements.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. FLUTTER – analyze (fast gate)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Flutter – analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter

      - name: Analyze
        working-directory: mobile
        run: flutter analyze lib/ test/

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. FLUTTER – widget tests + coverage
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-test:
    name: Flutter – widget tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter

      - name: Run all widget tests with coverage
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: flutter-coverage
          path: mobile/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. FLUTTER – web build (validates the build compiles)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-build-web:
    name: Flutter – build web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter

      - name: Build Flutter web
        working-directory: mobile
        run: flutter build web --release

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. ONTOLOGY – graph integrity tests (Neo4j only)
  # ─────────────────────────────────────────────────────────────────────────────
  ontology-test:
    name: Ontology – graph integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: 'gds.*'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - name: Wait for Neo4j HTTP API
        run: |
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until curl -sf -u neo4j:password http://localhost:7474/db/neo4j/tx/commit \
            -H "Content-Type: application/json" \
            -d "{\"statements\":[{\"statement\":\"RETURN 1\"}]}" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if not d[\"errors\"] else 1)" 2>/dev/null; do sleep 3; done'

      - name: Apply constraints
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse
          raw = open("neo4j/init/constraints.cypher").read()
          # Remove comment LINES first (they may contain semicolons and would
          # otherwise be bundled into / split out of real statements), THEN
          # split on semicolons to get individual statements.
          code = "\n".join(l for l in raw.split("\n") if not l.strip().startswith("//"))
          stmts = [s.strip() for s in code.split(";") if s.strip()]
          payload = json.dumps({"statements": [{"statement": s} for s in stmts]}).encode()
          req = urllib.request.Request(
              "http://localhost:7474/db/neo4j/tx/commit",
              data=payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          import base64
          req.add_header("Authorization", "Basic " + base64.b64encode(b"neo4j:password").decode())
          with urllib.request.urlopen(req) as r:
              d = json.loads(r.read())
              if d["errors"]:
                  raise SystemExit(f"Constraint errors: {d['errors']}")
          print("Constraints applied.")
          EOF

      - name: Seed minimal test data
        run: |
          python3 - <<'EOF'
          import json, urllib.request, base64

          def cypher(stmts):
              payload = json.dumps({"statements": [{"statement": s} for s in stmts]}).encode()
              req = urllib.request.Request(
                  "http://localhost:7474/db/neo4j/tx/commit",
                  data=payload,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              req.add_header("Authorization", "Basic " + base64.b64encode(b"neo4j:password").decode())
              with urllib.request.urlopen(req) as r:
                  d = json.loads(r.read())
                  if d["errors"]:
                      raise SystemExit(f"Seed error: {d['errors']}")

          cypher([
              "MERGE (h:Habit {uuid:'ci-habit-1'}) SET h.sentence='I drink water every morning.', h.language='en'",
              "MERGE (c:Context {text:'every morning', dimension:'TimeReference'})",
              "MERGE (b:BCIOConcept {uri:'http://humanbehaviourchange.org/ontology/BCIO#ci-1'}) SET b.name='Habit formation'",
              "MERGE (cm:Comment {id:'ci-comment-1'}) SET cm.text='Works for me!', cm.createdAt='2026-06-10T00:00:00Z'",
          ])
          cypher([
              "MATCH (h:Habit {uuid:'ci-habit-1'}), (c:Context {text:'every morning'}) MERGE (h)-[:HAS_CONTEXT]->(c)",
              "MATCH (c:Context {text:'every morning'}), (b:BCIOConcept {uri:'http://humanbehaviourchange.org/ontology/BCIO#ci-1'}) MERGE (c)-[:MAPS_TO]->(b)",
              "MATCH (cm:Comment {id:'ci-comment-1'}), (h:Habit {uuid:'ci-habit-1'}) MERGE (cm)-[:COMMENT_ON]->(h)",
          ])
          print("Seed data applied.")
          EOF

      - name: Run ontology test suite
        env:
          NEO4J_HTTP: http://localhost:7474
          NEO4J_USER: neo4j
          NEO4J_PASS: password
        run: bash tests/ontology/test-ontology.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. DOCKER – build validation (all four custom images)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker – build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Each image caches its layers to the GitHub Actions cache (scoped per
      # image) so unchanged layers are reused across runs instead of rebuilt.
      - name: Build app (Node.js)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build recommender (Python)
        uses: docker/build-push-action@v6
        with:
          context: ./API-service
          push: false
          cache-from: type=gha,scope=recommender
          cache-to: type=gha,mode=max,scope=recommender

      - name: Build backup-service
        uses: docker/build-push-action@v6
        with:
          context: ./backup-service
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Build admin (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: admin/Dockerfile
          tags: hhh-admin:ci
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  # ─────────────────────────────────────────────────────────────────────────────
  # 10. PYTHON API-SERVICE – pytest
  # ─────────────────────────────────────────────────────────────────────────────
  python-api-test:
    name: Python API-service – tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: API-service/requirements.txt

      - name: Install dependencies
        working-directory: API-service
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: API-service
        env:
          LLM_API_KEY: placeholder
          API_SERVICE_SECRET: test-api-service-secret
        run: pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────────
  # 10b. KNOWLEDGE-MCP – pytest
  # ─────────────────────────────────────────────────────────────────────────────
  knowledge-mcp-test:
    name: knowledge-mcp – tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: knowledge-mcp/requirements.txt

      - name: Install dependencies
        working-directory: knowledge-mcp
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: knowledge-mcp
        run: pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────────
  # 11. ADMIN – typecheck & build (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  admin-build:
    name: Admin – typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-app
        with:
          working-directory: admin

      - name: Typecheck
        working-directory: admin
        run: npx tsc --noEmit

      - name: Test
        working-directory: admin
        run: npx jest --ci

      - name: Build
        working-directory: admin
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # 12. FLUTTER – dependency audit (outdated major versions + graph integrity)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-dependency-audit:
    name: Flutter – dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter

      - name: Verify dependency graph resolves without conflicts
        working-directory: mobile
        run: flutter pub deps

      - name: Check for breaking major-version upgrades in direct dependencies
        # To suppress a specific outdated warning, upgrade intentionally:
        #   flutter pub upgrade --major-versions <package>
        # then commit the updated pubspec.yaml and pubspec.lock.
        working-directory: mobile
        run: |
          flutter pub outdated --json > /tmp/pub_outdated.json
          python3 - <<'EOF'
          import json, sys

          with open("/tmp/pub_outdated.json") as f:
              data = json.load(f)

          breaking = []
          skipped_prerelease = []
          for pkg in data.get("packages", []):
              if pkg.get("kind") != "direct":
                  continue
              current = (pkg.get("current") or {}).get("version")
              resolvable = (pkg.get("resolvable") or {}).get("version")
              if not current or not resolvable:
                  continue
              cur_major = int(current.split(".")[0])
              res_major = int(resolvable.split(".")[0])
              if res_major <= cur_major:
                  continue
              # Only flag STABLE major upgrades. A pre-release resolvable
              # (e.g. 10.0.0-alpha.1) is not something we can reasonably adopt,
              # so it should not fail the audit. Semver marks pre-releases with
              # a hyphen in the version string.
              if "-" in resolvable:
                  skipped_prerelease.append(f"  {pkg['package']}: {current} -> {resolvable} (pre-release, ignored)")
                  continue
              breaking.append(f"  {pkg['package']}: {current} -> {resolvable}")

          if skipped_prerelease:
              print("Pre-release major upgrades available (ignored):")
              print("\n".join(skipped_prerelease))

          if breaking:
              print("Breaking major-version upgrades available for direct dependencies:")
              print("\n".join(breaking))
              print("Run: flutter pub upgrade --major-versions <package> to upgrade intentionally.")
              sys.exit(1)
          else:
              print("No breaking (stable) major-version upgrades found.")
          EOF

  # ─────────────────────────────────────────────────────────────────────────────
  # 13. GATE – all jobs must pass before deploy can proceed
  # ─────────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - backend-lint
      - backend-unit
      - backend-integration
      - backend-security
      - python-security
      - flutter-analyze
      - flutter-test
      - flutter-build-web
      - ontology-test
      - docker-build
      - python-api-test
      - knowledge-mcp-test
      - admin-build
      - flutter-dependency-audit
    steps:
      - run: echo "All CI jobs passed."
