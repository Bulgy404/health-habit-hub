name: CI

on:
  push:
    branches:
      - master
      - ralph/hhh-platform-unified
  pull_request:
    branches:
      - master
      - rapid_dev

jobs:
  backend-test:
    name: Backend tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint --if-present

      - name: Typecheck
        working-directory: app
        run: npm run typecheck --if-present

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Generate coverage report
        working-directory: app
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: app/coverage/

  flutter-test:
    name: Flutter tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze lib/ test/

      - name: Flutter widget tests
        working-directory: mobile
        run: flutter test test/widget/ --coverage

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/

  ontology-test:
    name: Ontology & graph integrity tests
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc", "n10s"]'
          NEO4J_apoc_export_file_enabled: "true"
          NEO4J_apoc_import_file_enabled: "true"
          NEO4J_apoc_import_file_use__neo4j__config: "true"
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      fuseki:
        image: stain/jena-fuseki:4.9.0
        env:
          ADMIN_PASSWORD: admin
          FUSEKI_DATASET_1: hhh
        ports:
          - 3030:3030
        options: >-
          --health-cmd "curl -sf http://localhost:3030/$/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until cypher-shell --address bolt://localhost:7687 -u neo4j -p password "RETURN 1" 2>/dev/null; do sleep 3; done'
          echo "Waiting for Fuseki..."
          timeout 60 bash -c 'until curl -sf http://localhost:3030/$/ping; do sleep 3; done'

      - name: Install cypher-shell
        run: |
          wget -q https://dist.neo4j.org/cypher-shell/cypher-shell-5.latest.zip -O /tmp/cypher-shell.zip
          unzip -q /tmp/cypher-shell.zip -d /tmp/cypher-shell
          sudo ln -sf /tmp/cypher-shell/cypher-shell/bin/cypher-shell /usr/local/bin/cypher-shell

      - name: Bootstrap Neo4j schema (n10s + constraints)
        run: |
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            "CALL n10s.graphconfig.init({handleVocabUris:'SHORTEN', handleMultival:'OVERWRITE'});"
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            --file neo4j/init/constraints.cypher

      - name: Load ontology into Fuseki
        run: |
          curl -sf -X POST \
            -H "Content-Type: text/turtle" \
            --data-binary @fuseki/init/Ontology.ttl \
            "http://localhost:3030/hhh/data"

      - name: Load ontology into Neo4j via n10s
        run: |
          ONTOLOGY_PATH="$(pwd)/fuseki/init/Ontology.ttl"
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            "CALL n10s.onto.import.fetch('file://${ONTOLOGY_PATH}', 'Turtle');"

      - name: Seed minimal test data
        run: |
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            "MERGE (g1:hhh__ExperimentalSetting:hhh__Group1 {uri:'http://example.com/hhh#G1'})
             MERGE (g2:hhh__ExperimentalSetting:hhh__Group2 {uri:'http://example.com/hhh#G2'})
             MERGE (g3:hhh__ExperimentalSetting:hhh__Group3 {uri:'http://example.com/hhh#G3'})
             MERGE (g4:hhh__ExperimentalSetting:hhh__Group4 {uri:'http://example.com/hhh#G4'})
             MERGE (d1:hhh__Donor {uri:'http://example.com/hhh#d1', hhh__userId:'u1', hhh__group:'G1'})
             MERGE (h1:hhh__Habit {uri:'http://example.com/hhh#h1'})
             MERGE (d1)-[:hhh__donates]->(h1)
             MERGE (h1)-[:hhh__partOf]->(g1);"

      - name: Run ontology test suite
        env:
          NEO4J_URL: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASS: password
          FUSEKI_URL: http://localhost:3030
          FUSEKI_DATASET: hhh
        run: bash tests/ontology/test-ontology.sh
