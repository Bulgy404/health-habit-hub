name: CI

on:
  push:
    branches:
      - master
      - ralph/hhh-platform-unified
  pull_request:
    branches:
      - master
      - rapid_dev

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. BACKEND – lint & format (fast gate, no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend – lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Format check
        working-directory: app
        run: npx prettier --check .

      - name: Lint
        working-directory: app
        run: npx eslint .

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BACKEND – unit tests + coverage (no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend – unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: app
        run: >
          npx c8
          --include='middleware/**'
          --include='controllers/**'
          --include='routes/**'
          --include='services/**'
          --reporter=text
          --reporter=lcov
          node --test "tests/unit/**/*.test.js"

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: backend-unit-coverage
          path: app/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. BACKEND – integration tests (MongoDB + Neo4j + Fuseki)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend – integration tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc", "n10s"]'
          NEO4J_apoc_export_file_enabled: "true"
          NEO4J_apoc_import_file_enabled: "true"
          NEO4J_apoc_import_file_use__neo4j__config: "true"
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run integration tests
        working-directory: app
        env:
          NODE_ENV: test
          MONGO_HOST: localhost
          MONGO_USER: ""
          MONGO_PASSWORD: ""
          MONGO_DB: hhh_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          KEYCLOAK_URL: http://localhost:8080
        run: node --test "tests/integration/**/*.test.js"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. BACKEND – security audit
  # ─────────────────────────────────────────────────────────────────────────────
  backend-security:
    name: Backend – security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. FLUTTER – analyze (fast gate)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Flutter – analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze lib/ test/

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. FLUTTER – widget tests + coverage
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-test:
    name: Flutter – widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run all widget tests with coverage
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: flutter-coverage
          path: mobile/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. FLUTTER – web build (validates the build compiles)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-build-web:
    name: Flutter – build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter web
        working-directory: mobile
        run: flutter build web --release

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. ONTOLOGY – graph integrity tests (Neo4j only)
  # ─────────────────────────────────────────────────────────────────────────────
  ontology-test:
    name: Ontology – graph integrity
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v6

      - name: Wait for Neo4j HTTP API
        run: |
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until curl -sf -u neo4j:password http://localhost:7474/db/neo4j/tx/commit \
            -H "Content-Type: application/json" \
            -d "{\"statements\":[{\"statement\":\"RETURN 1\"}]}" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if not d[\"errors\"] else 1)" 2>/dev/null; do sleep 3; done'

      - name: Apply constraints
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse
          constraints = open("neo4j/init/constraints.cypher").read()
          # Strip comments and split on semicolons to get individual statements
          stmts = [s.strip() for s in constraints.split(";") if s.strip() and not s.strip().startswith("//")]
          payload = json.dumps({"statements": [{"statement": s} for s in stmts]}).encode()
          req = urllib.request.Request(
              "http://localhost:7474/db/neo4j/tx/commit",
              data=payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          import base64
          req.add_header("Authorization", "Basic " + base64.b64encode(b"neo4j:password").decode())
          with urllib.request.urlopen(req) as r:
              d = json.loads(r.read())
              if d["errors"]:
                  raise SystemExit(f"Constraint errors: {d['errors']}")
          print("Constraints applied.")
          EOF

      - name: Seed minimal test data
        run: |
          python3 - <<'EOF'
          import json, urllib.request, base64

          def cypher(stmts):
              payload = json.dumps({"statements": [{"statement": s} for s in stmts]}).encode()
              req = urllib.request.Request(
                  "http://localhost:7474/db/neo4j/tx/commit",
                  data=payload,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              req.add_header("Authorization", "Basic " + base64.b64encode(b"neo4j:password").decode())
              with urllib.request.urlopen(req) as r:
                  d = json.loads(r.read())
                  if d["errors"]:
                      raise SystemExit(f"Seed error: {d['errors']}")

          cypher([
              "MERGE (:hhh__ExperimentalSetting:hhh__Group1 {uri:'http://example.com/hhh#G1'})",
              "MERGE (:hhh__ExperimentalSetting:hhh__Group2 {uri:'http://example.com/hhh#G2'})",
              "MERGE (:hhh__ExperimentalSetting:hhh__Group3 {uri:'http://example.com/hhh#G3'})",
              "MERGE (:hhh__ExperimentalSetting:hhh__Group4 {uri:'http://example.com/hhh#G4'})",
              "MERGE (:hhh__Donor {uri:'http://example.com/hhh#d1', hhh__userId:'u1', hhh__group:'G1'})",
              "MERGE (:hhh__Habit {uri:'http://example.com/hhh#h1'})",
          ])
          cypher([
              "MATCH (d1:hhh__Donor {uri:'http://example.com/hhh#d1'}), (h1:hhh__Habit {uri:'http://example.com/hhh#h1'}) MERGE (d1)-[:hhh__donates]->(h1)",
              "MATCH (h1:hhh__Habit {uri:'http://example.com/hhh#h1'}), (g1:hhh__Group1 {uri:'http://example.com/hhh#G1'}) MERGE (h1)-[:hhh__partOf]->(g1)",
          ])
          print("Seed data applied.")
          EOF

      - name: Run ontology test suite
        env:
          NEO4J_HTTP: http://localhost:7474
          NEO4J_USER: neo4j
          NEO4J_PASS: password
        run: bash tests/ontology/test-ontology.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. GATE – all jobs must pass before deploy can proceed
  # ─────────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-unit
      - backend-integration
      - backend-security
      - flutter-analyze
      - flutter-test
      - flutter-build-web
      - ontology-test
    steps:
      - run: echo "All CI jobs passed."
