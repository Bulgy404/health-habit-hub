name: CI

on:
  push:
    branches:
      - master
      - ralph/hhh-platform-unified
  pull_request:
    branches:
      - master
      - rapid_dev

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. BACKEND – lint & format (fast gate, no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend – lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Format check
        working-directory: app
        run: npx prettier --check .

      - name: Lint
        working-directory: app
        run: npx eslint .

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BACKEND – unit tests + coverage (no services)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend – unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: app
        run: >
          npx c8
          --include='middleware/**'
          --include='controllers/**'
          --include='routes/**'
          --include='services/**'
          --reporter=text
          --reporter=lcov
          node --test "tests/unit/**/*.test.js"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: app/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. BACKEND – integration tests (MongoDB + Neo4j + Fuseki)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-integration:
    name: Backend – integration tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc", "n10s"]'
          NEO4J_apoc_export_file_enabled: "true"
          NEO4J_apoc_import_file_enabled: "true"
          NEO4J_apoc_import_file_use__neo4j__config: "true"
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run integration tests
        working-directory: app
        env:
          NODE_ENV: test
          MONGO_HOST: localhost
          MONGO_USER: ""
          MONGO_PASSWORD: ""
          MONGO_DB: hhh_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          KEYCLOAK_URL: http://localhost:8080
        run: node --test "tests/integration/**/*.test.js"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. BACKEND – security audit
  # ─────────────────────────────────────────────────────────────────────────────
  backend-security:
    name: Backend – security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. FLUTTER – analyze (fast gate)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Flutter – analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze lib/ test/

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. FLUTTER – widget tests + coverage
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-test:
    name: Flutter – widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run all widget tests with coverage
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. FLUTTER – web build (validates the build compiles)
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-build-web:
    name: Flutter – build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter web
        working-directory: mobile
        run: flutter build web --release

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. ONTOLOGY – graph integrity tests (Neo4j only)
  #    Fix: install cypher-shell BEFORE the wait loop that uses it
  # ─────────────────────────────────────────────────────────────────────────────
  ontology-test:
    name: Ontology – graph integrity
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc", "n10s"]'
          NEO4J_apoc_export_file_enabled: "true"
          NEO4J_apoc_import_file_enabled: "true"
          NEO4J_apoc_import_file_use__neo4j__config: "true"
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      # Install cypher-shell FIRST (needed by the wait loop below)
      - name: Install cypher-shell
        run: |
          wget -O- https://debian.neo4j.com/neotechnology.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/neo4j.gpg
          echo 'deb [signed-by=/usr/share/keyrings/neo4j.gpg] https://debian.neo4j.com stable latest' | sudo tee /etc/apt/sources.list.d/neo4j.list
          sudo apt-get update -qq
          sudo apt-get install -y cypher-shell

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until cypher-shell --address bolt://localhost:7687 -u neo4j -p password "RETURN 1" 2>/dev/null; do sleep 3; done'

      - name: Bootstrap Neo4j schema (n10s + constraints)
        run: |
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            "CALL n10s.graphconfig.init({handleVocabUris:'SHORTEN', handleMultival:'OVERWRITE'});"
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            --file neo4j/init/constraints.cypher

      - name: Load ontology into Neo4j via n10s
        run: |
          ONTOLOGY_PATH="$(pwd)/fuseki/init/Ontology.ttl"
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            "CALL n10s.onto.import.fetch('file://${ONTOLOGY_PATH}', 'Turtle');"

      - name: Seed minimal test data
        run: |
          cypher-shell --address bolt://localhost:7687 -u neo4j -p password \
            "MERGE (g1:hhh__ExperimentalSetting:hhh__Group1 {uri:'http://example.com/hhh#G1'})
             MERGE (g2:hhh__ExperimentalSetting:hhh__Group2 {uri:'http://example.com/hhh#G2'})
             MERGE (g3:hhh__ExperimentalSetting:hhh__Group3 {uri:'http://example.com/hhh#G3'})
             MERGE (g4:hhh__ExperimentalSetting:hhh__Group4 {uri:'http://example.com/hhh#G4'})
             MERGE (d1:hhh__Donor {uri:'http://example.com/hhh#d1', hhh__userId:'u1', hhh__group:'G1'})
             MERGE (h1:hhh__Habit {uri:'http://example.com/hhh#h1'})
             MERGE (d1)-[:hhh__donates]->(h1)
             MERGE (h1)-[:hhh__partOf]->(g1);"

      - name: Run ontology test suite
        env:
          NEO4J_URL: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASS: password
        run: bash tests/ontology/test-ontology.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. GATE – all jobs must pass before deploy can proceed
  # ─────────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-unit
      - backend-integration
      - backend-security
      - flutter-analyze
      - flutter-test
      - flutter-build-web
      - ontology-test
    steps:
      - run: echo "All CI jobs passed."
