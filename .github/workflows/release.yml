name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create GitHub Releases
  actions: read # needed to list workflow runs for the gate below

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # A tag push and the `main` branch push that produced the same commit
      # both trigger their own "CI" workflow run against the identical SHA
      # (ci.yml's `on:` matches both `branches: [main]` and `tags: ['v*']`).
      # Querying check-runs by name (`/commits/{sha}/check-runs`) can't tell
      # those two runs apart — it previously grabbed whichever "All checks
      # passed" check-run the API happened to list first, which blocked a
      # release when the *unrelated* main-branch run flaked even though the
      # tag's own CI run was green (see the v1.1.3 release attempt). Querying
      # workflow runs directly and filtering on `head_branch == ref_name`
      # (a tag push reports the tag name here) scopes the gate to the run
      # that actually validated this tag.
      - name: Gate — wait for CI to pass on this tag's own run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REF_NAME="${{ github.ref_name }}"
          echo "Waiting for the CI workflow run triggered by tag $REF_NAME (sha $SHA) …"

          for attempt in $(seq 1 30); do
            RESULT=$(gh api "/repos/${{ github.repository }}/actions/runs?head_sha=$SHA" \
              --jq "[.workflow_runs[] | select(.name == \"CI\" and .head_branch == \"$REF_NAME\")] | .[0]" 2>/dev/null || echo "null")

            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','not_found') if d else 'not_found')" 2>/dev/null || echo "not_found")
            CONCLUSION=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('conclusion','') if d else '')" 2>/dev/null || echo "")

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed ✓"
                break
              else
                echo "::error::CI did not pass for tag $REF_NAME (conclusion: $CONCLUSION) — refusing to publish release."
                exit 1
              fi
            fi

            echo "CI still running for tag $REF_NAME (attempt $attempt/30, status: $STATUS) — waiting 30 s …"
            sleep 30

            if [ "$attempt" = "30" ]; then
              echo "::error::Timed out after 15 minutes waiting for CI."
              exit 1
            fi
          done

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so we can read CHANGELOG.md

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          python3 - "$VERSION" <<'EOF'
          import sys, re

          version = sys.argv[1]
          changelog = open("CHANGELOG.md").read()

          # Match the section for this version: ## [X.Y.Z] — ...
          # Capture everything until the next ## [ heading
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, changelog, re.DOTALL)

          if m:
              body = m.group(1).strip()
          else:
              body = f"Release {version}.\n\nSee [CHANGELOG.md](CHANGELOG.md) for details."

          # Write to file so we can pass multiline content safely
          with open("/tmp/release_notes.md", "w") as f:
              f.write(body)

          print(f"Extracted {len(body)} chars for v{version}")
          EOF

      - name: Determine pre-release flag
        id: prerelease
        run: |
          if echo "$GITHUB_REF_NAME" | grep -qE '\-(alpha|beta|rc)\.[0-9]+$'; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.prerelease.outputs.IS_PRERELEASE }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            $PRERELEASE_FLAG \
            --verify-tag
