# Local Mac development with Traefik hostnames and Docker-provider routing.
# iOS Simulator shares the Mac network stack, so localhost works directly.
# Usage: docker compose -f docker-compose.local.yml up
services:
  proxy:
    image: traefik:v3.6.1
    container_name: hhh-proxy
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --api.debug=true
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hhh-proxy
      - --entrypoints.web.address=:80
    restart: always
    ports:
      - "${TRAEFIK_HOST_PORT80:-80}:80"
      - "${TRAEFIK_HOST_PORT8080:-8888}:8080"
    networks:
      - hhh-proxy
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`${PROXY_PATH:-proxy}.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.proxy.entrypoints=web
      - traefik.http.routers.proxy.service=proxy
      - traefik.http.services.proxy.loadbalancer.server.port=8080

  app:
    image: hhh/app
    container_name: hhh-app
    build: ./app
    restart: on-failure:3
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGO_HOST=mongo
      - KEYCLOAK_URL=http://keycloak:8080
      # Accept both internal Docker issuer and host-local issuer for iOS simulator
      # logins that use http://localhost:8080.
      - KEYCLOAK_JWT_ISSUER=http://keycloak:8080/realms/hhh,http://localhost:8080/realms/hhh
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-hhh}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-hhh-flutter}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-hhh-backend}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-CHANGE_THIS_KEYCLOAK_BACKEND_SECRET}
      - KEYCLOAK_ROPC_CLIENT_ID=${KEYCLOAK_ROPC_CLIENT_ID:-hhh-ropc}
      - KEYCLOAK_ROPC_CLIENT_SECRET=${KEYCLOAK_ROPC_CLIENT_SECRET:-CHANGE_THIS_KEYCLOAK_ROPC_SECRET}
      - API_SERVICE_SECRET=${API_SERVICE_SECRET}
      # Internal-only client for the admin Backups page — see backup-service/api/.
      - BACKUP_API_URL=http://backup:4100
      - BACKUP_API_SECRET=${BACKUP_API_SECRET:-CHANGE_THIS_BACKUP_API_SECRET}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-2048}
    ports:
      - "3000:3000"
    networks:
      - hhh-proxy
      - hhh-app
    command: node --watch main.js
    depends_on:
      proxy:
        condition: service_started
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
      backup:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${APP_PATH:-app}.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.routers.app.service=app
      - traefik.http.services.app.loadbalancer.server.port=3000

  mongo:
    image: mongo:8.2.6
    container_name: hhh-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin}
      - MONGO_INITDB_DATABASE=surveyjs
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./mongo/entrypoint:/docker-entrypoint-initdb.d
      - mongo-local-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - hhh-app

  neo4j:
    image: neo4j:5
    container_name: hhh-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password_change_me}
      - NEO4J_server_directories_import=/import
      - NEO4J_PLUGINS=["graph-data-science"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks:
      - hhh-proxy
      - hhh-app
    volumes:
      - neo4j-local-data:/data
      - neo4j-local-logs:/logs
      - ./neo4j/import:/import:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.neo4j.rule=Host(`neo4j.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.neo4j.entrypoints=web
      - traefik.http.routers.neo4j.service=neo4j
      - traefik.http.services.neo4j.loadbalancer.server.port=7474

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: hhh-keycloak
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=dev-file
    command: start-dev --import-realm --health-enabled=true
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - hhh-proxy
      - hhh-app
    volumes:
      - keycloak-local-data:/opt/keycloak/data
      - ./keycloak/hhh-realm.json:/opt/keycloak/data/import/hhh-realm.json:ro
      - ./keycloak/hhh-user-profile.json:/opt/keycloak/bootstrap/hhh-user-profile.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`keycloak.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.routers.keycloak.service=keycloak
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: hhh-keycloak-init
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./keycloak/hhh-user-profile.json:/opt/keycloak/bootstrap/hhh-user-profile.json:ro
    networks:
      - hhh-proxy
      - hhh-app
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      'until /opt/keycloak/bin/kcadm.sh config credentials
      --server http://keycloak:8080
      --realm master
      --user "$$KEYCLOAK_ADMIN"
      --password "$$KEYCLOAK_ADMIN_PASSWORD";
      do sleep 2; done &&
      /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=none &&
      /opt/keycloak/bin/kcadm.sh update realms/hhh -s sslRequired=none &&
      /opt/keycloak/bin/kcadm.sh update users/profile -r hhh -f /opt/keycloak/bootstrap/hhh-user-profile.json &&
      BACKEND_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-backend --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$BACKEND_ID -r hhh -s secret="$$KEYCLOAK_ADMIN_CLIENT_SECRET" &&
      ADMIN_UI_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-admin --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ADMIN_UI_ID -r hhh -s secret="$$KEYCLOAK_ADMIN_UI_CLIENT_SECRET" &&
      ROPC_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=hhh-ropc --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ROPC_ID -r hhh -s secret="$$KEYCLOAK_ROPC_CLIENT_SECRET" &&
      GRAFANA_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r hhh -q clientId=grafana --fields id --format csv --noquotes) &&
      if [ -n "$$GRAFANA_ID" ]; then
        /opt/keycloak/bin/kcadm.sh update clients/$$GRAFANA_ID -r hhh -s secret="$$GRAFANA_CLIENT_SECRET";
      else
        echo "WARNING: grafana client not found — recreate the Keycloak volume so the realm re-imports it" >&2;
      fi &&
      SA_ID=$$(/opt/keycloak/bin/kcadm.sh get clients/$$BACKEND_ID/service-account-user -r hhh --fields id --format csv --noquotes) &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$SA_ID --cclientid realm-management --rolename realm-admin &&
      HHH_ADMIN_USER="$${HHH_ADMIN_USER:-$$KEYCLOAK_ADMIN}" &&
      HHH_ADMIN_ID=$$(/opt/keycloak/bin/kcadm.sh get users -r hhh -q username=$$HHH_ADMIN_USER -q exact=true --fields id --format json 2>/dev/null | grep -o "\"id\" *: *\"[^\"]*\"" | head -n1 | grep -o "\"[^\"]*\"$$" | tr -d "\"") &&
      if [ -z "$$HHH_ADMIN_ID" ]; then
        echo "Creating HHH admin user: $$HHH_ADMIN_USER" &&
        /opt/keycloak/bin/kcadm.sh create users -r hhh -s username="$$HHH_ADMIN_USER" -s enabled=true -s emailVerified=true &&
        HHH_ADMIN_ID=$$(/opt/keycloak/bin/kcadm.sh get users -r hhh -q username=$$HHH_ADMIN_USER -q exact=true --fields id --format json 2>/dev/null | grep -o "\"id\" *: *\"[^\"]*\"" | head -n1 | grep -o "\"[^\"]*\"$$" | tr -d "\"");
      fi &&
      if [ -z "$$HHH_ADMIN_ID" ]; then
        echo "ERROR: could not create or find HHH admin user $$HHH_ADMIN_USER" >&2 && exit 1;
      fi &&
      /opt/keycloak/bin/kcadm.sh set-password -r hhh --userid $$HHH_ADMIN_ID --new-password "$$KEYCLOAK_ADMIN_PASSWORD" --temporary=false &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$HHH_ADMIN_ID --rolename admin &&
      /opt/keycloak/bin/kcadm.sh add-roles -r hhh --uid $$HHH_ADMIN_ID --rolename researcher &&
      echo "HHH admin user $$HHH_ADMIN_USER provisioned successfully (id=$$HHH_ADMIN_ID)"'

  admin:
    image: hhh/admin
    container_name: hhh-admin
    build: ./admin
    restart: on-failure:3
    env_file:
      - .env
    environment:
      - NEXTAUTH_URL=http://admin.${PATH_SUFFIX:-localhost}
      - NEXT_PUBLIC_NEXTAUTH_URL=http://admin.${PATH_SUFFIX:-localhost}
      - NEXT_PUBLIC_KEYCLOAK_BROWSER_URL=http://localhost:8080
      # Must match Grafana's own GF_SERVER_ROOT_URL below — visiting Grafana
      # at a different host/port than its configured root_url breaks its
      # OAuth callback and asset URLs.
      - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-http://grafana.${PATH_SUFFIX:-localhost}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - KEYCLOAK_CLIENT_ID=hhh-admin
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_ADMIN_UI_CLIENT_SECRET:-hhh-admin-secret-change-me}
      # Keycloak (start-dev) uses its configured hostname as the token issuer, not the
      # request host. In local dev this is localhost:8080 (the public-facing URL), so
      # tokens carry iss=http://localhost:8080/realms/hhh. KEYCLOAK_ISSUER must match
      # that value exactly for NextAuth/openid-client iss validation to succeed.
      # All actual container-to-container calls use KEYCLOAK_INTERNAL_URL (keycloak:8080).
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/hhh
      - KEYCLOAK_BROWSER_URL=http://localhost:8080
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
    ports:
      - "3001:3001"
    networks:
      - hhh-proxy
      - hhh-app
    depends_on:
      proxy:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`admin.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.routers.admin.service=admin
      - traefik.http.services.admin.loadbalancer.server.port=3001

  translate:
    image: libretranslate/libretranslate:v1.9.5
    container_name: hhh-translate
    restart: always
    env_file:
      - .env
    ports:
      - "5001:5000"
    networks:
      - hhh-proxy
      - hhh-app
    volumes:
      - translate-local-data:/root/.local/share/argos-translate/packages
    tty: true
    depends_on:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.translate.rule=Host(`${TRANSLATE_HOST:-translate}.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.translate.entrypoints=web
      - traefik.http.routers.translate.service=translate
      - traefik.http.services.translate.loadbalancer.server.port=5000

  redis:
    image: redis:7-alpine
    container_name: hhh-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-local-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - hhh-app

  redis-insight:
    image: redis/redisinsight:latest
    container_name: hhh-redis-insight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - hhh-proxy
      - hhh-app
    depends_on:
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.redis-insight.rule=Host(`redis-insight.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.redis-insight.entrypoints=web
      - traefik.http.routers.redis-insight.service=redis-insight
      - traefik.http.services.redis-insight.loadbalancer.server.port=5540

  lightrag:
    image: hhh/lightrag
    container_name: hhh-lightrag
    build: ./lightrag
    restart: on-failure:3
    env_file:
      - .env
    environment:
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY:-dev-lightrag-secret}
      - LLM_MODEL=${LLM_MODEL}
      - LIGHTRAG_LLM_MODEL=${LIGHTRAG_LLM_MODEL:-alias-huge-no-thinking}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - LLM_HEALTH_CHECK_INTERVAL_S=${LLM_HEALTH_CHECK_INTERVAL_S:-120}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
    ports:
      - "${LIGHTRAG_HOST_PORT:-9622}:9621"
    volumes:
      - lightrag-data:/app/data
    networks:
      - hhh-proxy
      - hhh-app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  knowledge-mcp:
    image: hhh/knowledge-mcp
    container_name: hhh-knowledge-mcp
    build: ./knowledge-mcp
    restart: on-failure:3
    environment:
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://lightrag:9621}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY:-dev-lightrag-secret}
    ports:
      - "8002:8002"
    networks:
      - hhh-app
    depends_on:
      - lightrag
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo-express:
    image: mongo-express:1.0
    container_name: hhh-mongo-express
    restart: unless-stopped
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD:-admin}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongo:27017/
      - ME_CONFIG_BASICAUTH=false
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - hhh-app
    depends_on:
      - mongo

  recommender:
    image: hhh/recommender
    container_name: hhh-recommender
    build: ./API-service
    restart: on-failure:3
    env_file:
      - .env
    environment:
      # .env sets MONGO_HOST=localhost for host-run scripts (e.g. seed); inside
      # the container Mongo is reached via the compose service name. Mirrors the
      # override on the `app` service (and the production compose recommender).
      - MONGO_HOST=mongo
      - API_SERVICE_SECRET=${API_SERVICE_SECRET}
      - LIGHTRAG_URL=${LIGHTRAG_URL:-http://lightrag:9621}
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY:-dev-lightrag-secret}
    ports:
      - "8001:8000"
    networks:
      - hhh-proxy
      - hhh-app
    depends_on:
      - redis
      - lightrag

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hhh-blackbox-exporter
    restart: unless-stopped
    networks:
      - hhh-proxy
      - hhh-app
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: hhh-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - hhh-proxy
      - hhh-app
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.prometheus.entrypoints=web
      - traefik.http.routers.prometheus.service=prometheus
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:12.0.1
    container_name: hhh-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.${PATH_SUFFIX:-localhost}
      # ── Keycloak SSO (generic OAuth) — local split-horizon URLs ──────────
      # Browser hits Keycloak on the published host port (localhost:8080);
      # Grafana (server-side) reaches it in-network as keycloak:8080. The
      # "grafana" realm client secret is injected by keycloak-init below.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET:-grafana-secret-change-me}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile roles
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost:8080/realms/hhh/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/hhh/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/realms/hhh/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'researcher') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      # Used by monitoring/grafana/provisioning/alerting/alerting.yaml to
      # expand $HHH_ALERT_EMAIL as the critical-alerts contact point address.
      - HHH_ALERT_EMAIL=${ALERT_EMAIL:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - hhh-proxy
      - hhh-app
    depends_on:
      - prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${PATH_SUFFIX:-localhost}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  backup:
    image: hhh/backup
    container_name: hhh-backup
    build: ./backup-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - OFFSITE_REMOTE=${OFFSITE_REMOTE:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - BACKUP_EMAIL=${BACKUP_EMAIL:-}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-admin}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      # Internal-only HTTP API used by the admin panel's Backups page
      # (status/trigger/restore/upload) — never published to the host, only
      # reachable from other containers on hhh-proxy.
      - BACKUP_API_SECRET=${BACKUP_API_SECRET:-CHANGE_THIS_BACKUP_API_SECRET}
      - BACKUP_UPLOAD_MAX_MB=${BACKUP_UPLOAD_MAX_MB:-2048}
      # docker.sock is never mounted directly into this container (that would
      # be root-equivalent host access) — the docker CLI talks to the scoped
      # docker-socket-proxy below instead, reachable only on the
      # hhh-backup-internal network.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./backups:/backups
      - ./backup-service/rclone:/config/rclone:ro
      - lightrag-data:/lightrag:ro
    networks:
      - hhh-proxy
      - hhh-app
      - hhh-backup-internal
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      lightrag:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    # Also starts the internal backup-api HTTP server (see backup-service/api/)
    # on port 4100 — no ports: block, it's only reachable inside hhh-proxy.

  # See docker-compose.yml for the full rationale — same scoped-proxy
  # pattern, kept in sync between prod and local.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: hhh-docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - VOLUMES=1
      - IMAGES=1
      - POST=1
      - EXEC=0
      - NETWORKS=0
      - SWARM=0
      - SERVICES=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - CONFIGS=0
      - BUILD=0
      - COMMIT=0
      - SESSION=0
      - AUTH=0
      - DISTRIBUTION=0
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - hhh-backup-internal

volumes:
  mongo-local-data:
  neo4j-local-data:
  neo4j-local-logs:
  keycloak-local-data:
  translate-local-data:
  redis-local-data:
  redis-insight-data:
  lightrag-data:
  prometheus-data:
  grafana-data:

networks:
  hhh-proxy:
    name: hhh-proxy
  hhh-app:
    name: hhh-app
  hhh-backup-internal:
    name: hhh-backup-internal
    internal: true
