# Local Mac development — no Traefik, no TLS, no production-only services.
# iOS Simulator shares the Mac network stack, so localhost works directly.
# Usage: docker compose -f docker-compose.local.yml up
services:
  app:
    image: hhh/app
    container_name: h3-2-app
    build: ./app
    restart: on-failure:3
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGO_HOST=mongo
    ports:
      - "3000:3000"
    command: node --watch app.js
    depends_on:
      - mongo
      - fuseki
      - neo4j
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo
    container_name: h3-2-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin}
      - MONGO_INITDB_DATABASE=surveyjs
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/entrypoint:/docker-entrypoint-initdb.d
      - mongo-local-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5
    container_name: h3-2-neo4j
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password_change_me}
      - NEO4J_PLUGINS=["n10s"]
      - NEO4J_server_directories_import=/import
      - NEO4J_dbms_security_procedures_unrestricted=n10s.*
      - NEO4J_dbms_security_procedures_allowlist=n10s.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-local-data:/data
      - neo4j-local-logs:/logs
      - ./fuseki/init:/import:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: h3-2-keycloak
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=dev-file
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - keycloak-local-data:/opt/keycloak/data
      - ./keycloak/hhh-realm.json:/opt/keycloak/data/import/hhh-realm.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  translate:
    image: libretranslate/libretranslate:1.5
    container_name: h3-2-translate
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - translate-local-data:/root/.local/share/argos-translate/packages
    tty: true

  redis:
    image: redis:7-alpine
    container_name: h3-2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-local-data:/data
    command: redis-server --appendonly yes

  recommender:
    image: hhh/recommender
    container_name: h3-2-recommender
    build: ./API-service
    restart: on-failure:3
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - redis

  fuseki:
    image: hhh/fuseki
    container_name: h3-2-fuseki
    build: ./fuseki
    restart: always
    env_file:
      - .env
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    ports:
      - "3030:3030"
    volumes:
      - fuseki-local-data:/fuseki

volumes:
  mongo-local-data:
  neo4j-local-data:
  neo4j-local-logs:
  keycloak-local-data:
  translate-local-data:
  fuseki-local-data:
  redis-local-data:
