<svg width="1080" height="420" viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .box-label { font-size: 12.5px; font-weight: 700; fill: #1E2422; text-anchor: middle; }
      .box-sub { font-size: 10px; fill: #6B6B67; text-anchor: middle; }
      .path-label { font-size: 11px; font-weight: 700; fill: #6B6B67; text-anchor: middle; }
    </style>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9A9A94"/>
    </marker>
  </defs>
  <rect width="1080" height="420" class="bg"/>

  <text x="30" y="34" font-size="16" font-weight="800" fill="#1E2422">Critical alerts — two independent paths, one inbox</text>
  <text x="30" y="54" font-size="12" fill="#6B6B67">Both paths share the same SMTP credentials and land in the same ALERT_EMAIL.</text>

  <text x="230" y="90" class="path-label">fires directly from application code</text>
  <text x="820" y="90" class="path-label">metric-driven, via Grafana unified alerting</text>

  <g stroke="#9A9A94" stroke-width="1.5" fill="none" marker-end="url(#arrow6)">
    <path d="M230 175 L230 240"/>
    <path d="M400 175 L280 240"/>
    <path d="M660 175 L800 240"/>
    <path d="M820 175 L820 240"/>
    <path d="M980 175 L900 240"/>
    <path d="M280 300 L490 340"/>
    <path d="M820 300 L610 340"/>
  </g>

  <!-- triggers, left group (direct) -->
  <g transform="translate(120,110)">
    <rect width="220" height="56" rx="10" fill="#FFF8E1" stroke="#FFA000" stroke-width="2"/>
    <text x="110" y="24" class="box-label">Backup run</text>
    <text x="110" y="42" class="box-sub">backup.sh, every scheduled/manual run</text>
  </g>
  <g transform="translate(370,110)">
    <rect width="220" height="56" rx="10" fill="#FFF8E1" stroke="#FFA000" stroke-width="2"/>
    <text x="110" y="24" class="box-label">LLM unavailable</text>
    <text x="110" y="42" class="box-sub">circuit breaker: primary and/or fallback</text>
  </g>

  <!-- triggers, right group (grafana) -->
  <g transform="translate(600,110)">
    <rect width="220" height="56" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="110" y="24" class="box-label">BullMQ job failures</text>
    <text x="110" y="42" class="box-sub">terminal failures, bullmq_jobs_failed_total</text>
  </g>
  <g transform="translate(830,110)">
    <rect width="120" height="56" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="60" y="24" class="box-label">Service down</text>
    <text x="60" y="42" class="box-sub">blackbox 2+ min</text>
  </g>
  <g transform="translate(960,110)">
    <rect width="110" height="56" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="55" y="24" class="box-label">5xx spike</text>
    <text x="55" y="42" class="box-sub">&gt;0.1 req/s, 5+ min</text>
  </g>

  <!-- two paths -->
  <g transform="translate(140,240)">
    <rect width="280" height="60" rx="10" fill="#FDECEA" stroke="#E53935" stroke-width="2.5"/>
    <text x="140" y="26" class="box-label">alerting.py / send_smtp_mail()</text>
    <text x="140" y="44" class="box-sub">app code calls SMTP directly, no Prometheus needed</text>
  </g>
  <g transform="translate(680,240)">
    <rect width="280" height="60" rx="10" fill="#FDECEA" stroke="#E53935" stroke-width="2.5"/>
    <text x="140" y="26" class="box-label">Grafana unified alerting</text>
    <text x="140" y="44" class="box-sub">alerting.yaml rules, group/repeat intervals</text>
  </g>

  <!-- inbox -->
  <g transform="translate(430,340)">
    <rect width="220" height="56" rx="12" fill="#F1F0FB" stroke="#4F46E5" stroke-width="2.5"/>
    <text x="110" y="24" class="box-label">ALERT_EMAIL</text>
    <text x="110" y="42" class="box-sub">same SMTP_* credentials, both paths</text>
  </g>
</svg>
