<svg width="1240" height="760" viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .box-label { font-size: 14px; font-weight: 700; fill: #1E2422; text-anchor: middle; }
      .box-sub { font-size: 11px; fill: #6B6B67; text-anchor: middle; }
      .group-label { font-size: 12px; font-weight: 700; fill: #9A9A94; text-anchor: start; letter-spacing: 0.5px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9A9A94"/>
    </marker>
  </defs>
  <rect width="1240" height="760" class="bg"/>

  <!-- connectors (drawn first, boxes on top) -->
  <g stroke="#9A9A94" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <!-- clients -> proxy -->
    <path d="M205 100 L500 160"/>
    <path d="M1035 100 L740 160"/>
    <!-- proxy -> app/admin/keycloak/oauth2-proxy -->
    <path d="M560 220 L165 280"/>
    <path d="M600 220 L455 280"/>
    <path d="M660 220 L680 280"/>
    <path d="M700 220 L1000 280"/>
    <!-- app -> recommender -->
    <path d="M165 340 L165 400"/>
    <!-- app -> data stores -->
    <path d="M120 340 C 60 460, 60 580, 130 640"/>
    <path d="M165 340 L330 640"/>
    <path d="M210 340 C 400 460, 500 580, 590 640"/>
    <!-- recommender -> lightrag / llm -->
    <path d="M140 460 L140 520"/>
    <path d="M195 460 L390 520"/>
    <!-- recommender -> redis (cache) -->
    <path d="M270 430 C 450 500, 550 560, 605 640"/>
    <!-- oauth2-proxy -> internal tools -->
    <path d="M1000 340 L1000 400"/>
  </g>

  <!-- Row 1: clients -->
  <g transform="translate(80,50)">
    <rect width="260" height="60" rx="12" fill="#F1F0FB" stroke="#4F46E5" stroke-width="2"/>
    <text x="130" y="28" class="box-label">Flutter App</text>
    <text x="130" y="46" class="box-sub">Participants — iOS / Android / Web</text>
  </g>
  <g transform="translate(900,50)">
    <rect width="260" height="60" rx="12" fill="#F1F0FB" stroke="#4F46E5" stroke-width="2"/>
    <text x="130" y="28" class="box-label">Browser</text>
    <text x="130" y="46" class="box-sub">Researchers / Admins</text>
  </g>

  <!-- Row 2: proxy -->
  <g transform="translate(460,170)">
    <rect width="280" height="60" rx="12" fill="#FFF8E1" stroke="#FFA000" stroke-width="2"/>
    <text x="140" y="28" class="box-label">Traefik Proxy</text>
    <text x="140" y="46" class="box-sub">TLS (Let's Encrypt) · path routing on one domain</text>
  </g>

  <!-- Row 3: app / admin / identity -->
  <g transform="translate(40,290)">
    <rect width="250" height="60" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="125" y="28" class="box-label">app — Node/Express</text>
    <text x="125" y="46" class="box-sub">/api/v1/* · JWT via Keycloak JWKS · :3000</text>
  </g>
  <g transform="translate(330,290)">
    <rect width="250" height="60" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="125" y="28" class="box-label">admin — Next.js</text>
    <text x="125" y="46" class="box-sub">/admin · NextAuth OIDC · :3001</text>
  </g>
  <g transform="translate(620,290)">
    <rect width="180" height="60" rx="12" fill="#FDECEA" stroke="#E53935" stroke-width="2"/>
    <text x="90" y="28" class="box-label">Keycloak</text>
    <text x="90" y="46" class="box-sub">Identity provider · /auth</text>
  </g>
  <g transform="translate(890,290)">
    <rect width="250" height="60" rx="12" fill="#FDECEA" stroke="#E53935" stroke-width="2"/>
    <text x="125" y="28" class="box-label">oauth2-proxy</text>
    <text x="125" y="46" class="box-sub">SSO forward-auth · admin-role gate</text>
  </g>

  <!-- Row 4: recommender / internal tools -->
  <g transform="translate(40,410)">
    <rect width="250" height="60" rx="12" fill="#EDE7F6" stroke="#7C4DFF" stroke-width="2"/>
    <text x="125" y="28" class="box-label">recommender — Python</text>
    <text x="125" y="46" class="box-sub">FastAPI · LLM classification/RAG · :8000</text>
  </g>
  <g transform="translate(890,410)">
    <rect width="250" height="70" rx="12" fill="#F5F5F0" stroke="#9A9A94" stroke-width="2"/>
    <text x="125" y="24" class="box-label">Internal tools</text>
    <text x="125" y="42" class="box-sub">Grafana · Prometheus · Bull Board</text>
    <text x="125" y="58" class="box-sub">mongo-express · RedisInsight</text>
  </g>

  <!-- Row 5: lightrag / external LLM -->
  <g transform="translate(40,530)">
    <rect width="200" height="60" rx="12" fill="#EDE7F6" stroke="#7C4DFF" stroke-width="2"/>
    <text x="100" y="28" class="box-label">LightRAG</text>
    <text x="100" y="46" class="box-sub">graph + vector KB · :9621</text>
  </g>
  <g transform="translate(280,530)">
    <rect width="220" height="60" rx="12" fill="#FAFAFA" stroke="#9A9A94" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="110" y="28" class="box-label">LLM (external)</text>
    <text x="110" y="46" class="box-sub">llm.scads.ai — OpenAI-compatible</text>
  </g>

  <!-- Row 6: data stores -->
  <g transform="translate(30,650)">
    <rect width="220" height="60" rx="12" fill="#E0F7FA" stroke="#00897B" stroke-width="2"/>
    <text x="110" y="28" class="box-label">MongoDB</text>
    <text x="110" y="46" class="box-sub">studies, logs, questionnaires · :27017</text>
  </g>
  <g transform="translate(280,650)">
    <rect width="220" height="60" rx="12" fill="#E0F7FA" stroke="#00897B" stroke-width="2"/>
    <text x="110" y="28" class="box-label">Neo4j</text>
    <text x="110" y="46" class="box-sub">habit / BCIO graph · bolt :7687</text>
  </g>
  <g transform="translate(530,650)">
    <rect width="220" height="60" rx="12" fill="#E0F7FA" stroke="#00897B" stroke-width="2"/>
    <text x="110" y="28" class="box-label">Redis</text>
    <text x="110" y="46" class="box-sub">cache · BullMQ · notification lock</text>
  </g>

  <!-- legend -->
  <g transform="translate(830,650)" font-size="11" fill="#6B6B67">
    <circle cx="0" cy="0" r="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="12" y="4">Application</text>
    <circle cx="0" cy="22" r="6" fill="#FDECEA" stroke="#E53935" stroke-width="1.5"/>
    <text x="12" y="26">Identity / edge</text>
    <circle cx="130" cy="0" r="6" fill="#EDE7F6" stroke="#7C4DFF" stroke-width="1.5"/>
    <text x="142" y="4">AI / knowledge</text>
    <circle cx="130" cy="22" r="6" fill="#E0F7FA" stroke="#00897B" stroke-width="1.5"/>
    <text x="142" y="26">Data store</text>
  </g>
</svg>
