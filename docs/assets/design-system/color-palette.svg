<svg width="1180" height="480" viewBox="0 0 1180 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .swatch-name { font-size: 13px; font-weight: 700; fill: #1E2422; }
      .swatch-hex { font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; fill: #6B6B67; }
      .swatch-note { font-size: 10.5px; fill: #9A9A94; }
      .section-title { font-size: 13px; font-weight: 800; fill: #6B6B67; letter-spacing: 0.4px; }
      .caption { font-size: 11px; fill: #9A9A94; }
    </style>
  </defs>
  <rect width="1180" height="480" class="bg"/>

  <text x="30" y="34" font-size="16" font-weight="800" fill="#1E2422">Color tokens — AppColors (mobile/lib/theme/app_colors.dart)</text>
  <text x="30" y="54" font-size="12" fill="#6B6B67">Every value below is theme-aware: light-mode hex shown, dark-mode differs only where noted.</text>

  <!-- Swatch row -->
  <g transform="translate(30,80)">
    <rect width="150" height="80" rx="12" fill="#45B700"/>
    <text x="10" y="100" class="swatch-name">primary</text>
    <text x="10" y="118" class="swatch-hex">#45B700</text>
    <text x="10" y="132" class="swatch-note">same in dark mode</text>
  </g>

  <g transform="translate(200,80)">
    <rect width="150" height="80" rx="12" fill="#2E8C00"/>
    <text x="10" y="100" class="swatch-name">primaryDark</text>
    <text x="10" y="118" class="swatch-hex">#2E8C00</text>
    <text x="10" y="132" class="swatch-note">same in dark mode</text>
  </g>

  <g transform="translate(370,80)">
    <rect width="150" height="80" rx="12" fill="#EDF7E5" stroke="#E5E4DC" stroke-width="1"/>
    <text x="10" y="100" class="swatch-name">greenLight</text>
    <text x="10" y="118" class="swatch-hex">#EDF7E5</text>
    <text x="10" y="132" class="swatch-note">dark: #203A17</text>
  </g>

  <g transform="translate(540,80)">
    <rect width="150" height="80" rx="12" fill="#E679AB"/>
    <text x="10" y="100" class="swatch-name">accent</text>
    <text x="10" y="118" class="swatch-hex">#E679AB</text>
    <text x="10" y="132" class="swatch-note">same in dark mode</text>
  </g>

  <g transform="translate(710,80)">
    <rect width="150" height="80" rx="12" fill="#DC2626"/>
    <text x="10" y="100" class="swatch-name">error</text>
    <text x="10" y="118" class="swatch-hex">#DC2626</text>
    <text x="10" y="132" class="swatch-note">dark: #F87171</text>
  </g>

  <g transform="translate(880,80)">
    <rect width="150" height="80" rx="12" fill="#111827"/>
    <text x="10" y="100" class="swatch-name" fill="#FFFFFF">text</text>
    <text x="10" y="118" class="swatch-hex" fill="#D1D5DB">#111827</text>
    <text x="10" y="132" class="swatch-note" fill="#9CA3AF">dark: #F0F0F0</text>
  </g>

  <g transform="translate(1050,80)">
    <rect width="100" height="80" rx="12" fill="#E5E7EB"/>
    <text x="8" y="100" class="swatch-name">border</text>
    <text x="8" y="118" class="swatch-hex">#E5E7EB</text>
    <text x="8" y="132" class="swatch-note">dark: #3A3A3A</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="235" x2="1150" y2="235" stroke="#E5E4DC" stroke-width="1"/>
  <line x1="600" y1="255" x2="600" y2="420" stroke="#E5E4DC" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left: solid fill examples -->
  <text x="30" y="270" class="section-title">SOLID FILL, white content on top → primaryDark</text>
  <g transform="translate(30,290)">
    <rect width="220" height="52" rx="26" fill="#2E8C00"/>
    <text x="110" y="32" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Get Recommendations</text>
  </g>
  <g transform="translate(270,290)">
    <rect width="180" height="52" rx="26" fill="#2E8C00"/>
    <text x="90" y="32" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Create a habit</text>
  </g>
  <text x="30" y="375" class="caption">Every FilledButton/ElevatedButton in the app defaults to this</text>
  <text x="30" y="390" class="caption">via filledButtonTheme — #45B700 fails WCAG AA for white text</text>
  <text x="30" y="405" class="caption">(2.62:1); #2E8C00 clears it (4.31:1+).</text>

  <!-- Right: accent examples -->
  <text x="630" y="270" class="section-title">ACCENT, on a light/white surface → primary</text>
  <g transform="translate(630,290)">
    <circle cx="20" cy="20" r="20" fill="#EDF7E5"/>
    <path d="M11 20 L17 26 L29 12" stroke="#45B700" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="662" y="296" font-size="14" font-weight="800" fill="#45B700">Shared today</text>
  <text x="630" y="335" font-size="13" font-weight="700" fill="#45B700">Read more about the project →</text>
  <text x="630" y="375" class="caption">Text links, hero icon boxes (icon on greenLight tint),</text>
  <text x="630" y="390" class="caption">and status checkmarks — never white text/icon needing</text>
  <text x="630" y="405" class="caption">contrast against a fill.</text>

  <text x="30" y="450" font-size="12" font-weight="700" fill="#E53935">Don't mix them on the same element: a solid-fill button using primary (bright) instead of primaryDark is the one bug this system was written to prevent.</text>
</svg>
