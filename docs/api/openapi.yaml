openapi: 3.1.0
info:
  title: Health Habit Hub API
  version: 1.0.0
  description: >-
    REST API for the Health Habit Hub platform. Manages participants, surveys, shared habits, recommendations, and
    profiles. All endpoints (except /health) require a Keycloak JWT bearer token.
  contact:
    name: HHH Development Team
  license:
    name: MIT
externalDocs:
  description: Python Recommender Service OpenAPI spec (API-service/openapi.yaml)
  url: https://github.com/Health-Habit-Hub/hhh/blob/master/API-service/openapi.yaml
servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://hhh.example.com/api/v1
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT. Obtain from POST /realms/hhh/protocol/openid-connect/token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Internal server error
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - error
          example: ok
        latencyMs:
          type: number
          example: 12
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - error
          example: ok
        services:
          type: object
          properties:
            neo4j:
              $ref: '#/components/schemas/ServiceStatus'
            mongo:
              $ref: '#/components/schemas/ServiceStatus'
            keycloak:
              $ref: '#/components/schemas/ServiceStatus'
            recommender:
              $ref: '#/components/schemas/ServiceStatus'
    Participant:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-...
        username:
          type: string
          example: p-a1b2c3d4-...
        group:
          type: string
          nullable: true
          enum:
            - G1
            - G2
            - G3
            - G4
            - null
          example: G2
        enrolledAt:
          type: string
          format: date-time
        lastActive:
          type: string
          format: date-time
          nullable: true
        surveyCompletionPct:
          type: number
          example: 0.5
    Survey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Baseline Questionnaire
        type:
          type: string
          example: questionnaire
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          example: published
        assignedGroups:
          type: array
          items:
            type: string
            enum:
              - G1
              - G2
              - G3
              - G4
          example:
            - G1
            - G2
    Profile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        answers:
          type: object
          additionalProperties: true
          example:
            age: 30
            goal: exercise more
        completedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Habit:
      type: object
      properties:
        id:
          type: string
          example: habit-uuid
        name:
          type: string
          example: Go for a 30-min walk daily
        category:
          type: string
          nullable: true
          example: Group1
        bcioClass:
          type: string
          nullable: true
        annotationCounts:
          type: object
          properties:
            helpful:
              type: integer
              example: 5
            iDoThis:
              type: integer
              example: 3
    HabitStats:
      type: object
      properties:
        total:
          type: integer
          example: 142
        byCategory:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                example: Group1
              count:
                type: integer
                example: 42
        byDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: '2026-03-15'
              count:
                type: integer
                example: 7
security:
  - bearerAuth: []
paths:
  /docs:
    get:
      summary: Swagger UI – interactive API documentation
      description: >-
        Serves the Swagger UI for exploring and testing all HHH API endpoints. No authentication required to view the
        docs.
      tags:
        - Docs
      security: []
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
  /docs/openapi.json:
    get:
      summary: Raw OpenAPI spec in JSON format
      description: Returns the full OpenAPI 3.1 specification as JSON.
      tags:
        - Docs
      security: []
      responses:
        '200':
          description: OpenAPI spec JSON
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      summary: Check health of all downstream services
      description: >-
        Returns the live health status and latency of neo4j, mongo, keycloak, and the recommender service. This endpoint
        is unauthenticated.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: All critical services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                services:
                  neo4j:
                    status: ok
                    latencyMs: 8
                  mongo:
                    status: ok
                    latencyMs: 5
                  keycloak:
                    status: ok
                    latencyMs: 30
                  recommender:
                    status: ok
                    latencyMs: 15
        '503':
          description: One or more critical services (neo4j, mongo) are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: error
                services:
                  neo4j:
                    status: error
                    latencyMs: 0
                  mongo:
                    status: ok
                    latencyMs: 5
                  keycloak:
                    status: ok
                    latencyMs: 30
                  recommender:
                    status: ok
                    latencyMs: 15
  /admin:
    get:
      summary: Admin base route health check
      description: Returns {"ok":true} to verify admin access is working.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin route is accessible
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
  /admin/settings:
    get:
      summary: Get all admin settings
      description: Returns a key-value map of all admin configuration settings (e.g., token_card_format).
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                token_card_format: both
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin role (settings are admin-only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/settings/{key}:
    put:
      summary: Update an admin setting
      description: Upserts a single admin configuration key-value pair.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: Setting key
          example: token_card_format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  example: qr
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  key:
                    type: string
                    example: token_card_format
                  value:
                    type: string
                    example: qr
        '400':
          description: Missing value field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing value
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin role (settings are admin-only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/habits/feed/export:
    get:
      summary: Export donated habits as CSV
      description: Downloads all donated habits as a CSV file. Supports filtering by group, category, and date range.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: group
          schema:
            type: string
            enum:
              - G1
              - G2
              - G3
              - G4
          description: Filter by study group
        - in: query
          name: category
          schema:
            type: string
          description: Filter by habit category
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Filter habits donated on or after this date (ISO 8601)
          example: '2026-03-01'
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Filter habits donated on or before this date (ISO 8601)
          example: '2026-03-31'
        - in: query
          name: format
          schema:
            type: string
            enum:
              - csv
            default: csv
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                example: |-
                  participantId,habitName,category,donatedAt
                  anon-001,Walk daily,G1,2026-03-15T08:00:00.000Z
        '400':
          description: Invalid format parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/habits/feed:
    get:
      summary: Paginated donated habits feed
      description: Returns paginated list of donated habits with optional filtering by group, category, and date range.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: group
          schema:
            type: string
            enum:
              - G1
              - G2
              - G3
              - G4
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
          example: '2026-03-01'
        - in: query
          name: to
          schema:
            type: string
            format: date
          example: '2026-03-31'
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated habit donations
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 142
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        participantId:
                          type: string
                        habitName:
                          type: string
                        category:
                          type: string
                        donatedAt:
                          type: string
                          format: date-time
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/sessions:
    get:
      summary: List active Keycloak sessions
      description: Returns all active user sessions from Keycloak for the hhh realm.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of Keycloak session objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
                - id: session-abc123
                  userId: a1b2c3d4-...
                  username: p-a1b2c3d4
                  start: 1742000000000
                  lastAccess: 1742040000000
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/sessions/{sessionId}:
    delete:
      summary: Revoke a Keycloak session
      description: Invalidates the specified Keycloak session, forcing the user to re-authenticate.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Keycloak session ID
          example: session-abc123
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/notifications/send:
    post:
      summary: Send push notification immediately to study participants
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studyId
                - title
                - body
              properties:
                studyId:
                  type: string
                groupId:
                  type: string
                  description: Optional group filter
                title:
                  type: string
                body:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: Notification dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: integer
                  failed:
                    type: integer
        '400':
          description: Missing required fields
  /admin/notifications/schedule:
    post:
      summary: Schedule a push notification for future delivery
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studyId
                - title
                - body
                - scheduledAt
              properties:
                studyId:
                  type: string
                groupId:
                  type: string
                title:
                  type: string
                body:
                  type: string
                data:
                  type: object
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Notification scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '400':
          description: Missing required fields or invalid scheduledAt
  /admin/notifications/scheduled:
    get:
      summary: List pending scheduled notifications
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of pending scheduled notifications
  /admin/notifications/scheduled/{id}:
    delete:
      summary: Cancel a pending scheduled notification
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification cancelled
        '404':
          description: Notification not found or already sent
  /admin/participants:
    get:
      summary: List all active participants
      description: Returns all participants that have not been soft-deleted.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of participant summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
              example:
                - userId: a1b2c3d4-1234-5678-abcd-ef0123456789
                  username: p-a1b2c3d4
                  group: G2
                  enrolledAt: '2026-03-01T09:00:00.000Z'
                  lastActive: '2026-03-15T14:00:00.000Z'
                  surveyCompletionPct: 0.5
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new participant
      description: >-
        Creates a Keycloak user with the participant role, inserts a MongoDB record, generates a token card PDF, and
        returns the participant identifiers plus a token card URL.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Participant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  username:
                    type: string
                    example: p-a1b2c3d4
                  tokenCardUrl:
                    type: string
                    example: /api/v1/admin/participants/a1b2c3d4.../token-card
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/participants/{id}/group:
    patch:
      summary: Assign participant to a study group
      description: Updates the participant's study group in MongoDB, Keycloak attributes, and Neo4j node labels.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Participant userId
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - group
              properties:
                group:
                  type: string
                  enum:
                    - G1
                    - G2
                    - G3
                    - G4
                  example: G2
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  userId:
                    type: string
                    format: uuid
                  group:
                    type: string
                    enum:
                      - G1
                      - G2
                      - G3
                      - G4
        '400':
          description: Invalid group value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid group. Must be G1, G2, G3, or G4
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Participant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/participants/{id}/token-card:
    get:
      summary: Download participant token card PDF
      description: Returns the pre-generated PDF token card for the specified participant.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Participant userId
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
      responses:
        '200':
          description: PDF token card
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Participant not found or token card not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/participants/{id}/progress:
    get:
      summary: Get participant progress summary
      description: >-
        Returns profile completion status, survey responses, habit donation count, recommendation acceptance/dismissal
        counts, and a chronological activity timeline.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Participant userId
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
      responses:
        '200':
          description: Participant progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: object
                    properties:
                      completed:
                        type: boolean
                      completedAt:
                        type: string
                        format: date-time
                        nullable: true
                  surveys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        completedAt:
                          type: string
                          format: date-time
                  habitsCount:
                    type: integer
                  recommendations:
                    type: object
                    properties:
                      accepted:
                        type: integer
                      dismissed:
                        type: integer
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        detail:
                          type: string
              example:
                profile:
                  completed: true
                  completedAt: '2026-03-02T10:00:00.000Z'
                surveys:
                  - id: survey-uuid-001
                    title: Baseline Questionnaire
                    completedAt: '2026-03-03T11:00:00.000Z'
                habitsCount: 7
                recommendations:
                  accepted: 3
                  dismissed: 1
                timeline:
                  - type: enrolled
                    timestamp: '2026-03-01T09:00:00.000Z'
                    detail: Participant enrolled
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Participant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/participants/{id}:
    delete:
      summary: Soft-delete a participant
      description: >-
        Sets deletedAt timestamp and anonymizes the username. The participant record is retained for data integrity but
        excluded from all participant listings.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Participant userId
      responses:
        '200':
          description: Participant soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
