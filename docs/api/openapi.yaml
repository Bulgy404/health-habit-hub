        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have admin or researcher role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/surveys/{id}:
