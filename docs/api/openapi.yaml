  /onboard:
    post:
      summary: Anonymous self-registration
      description: >-
        Creates a new Keycloak user with the participant role and immediately
        exchanges credentials for a JWT. No prior authentication required. Rate
        limited to 5 requests per IP per hour.
      tags:
        - Onboard
      security: []
      responses:
        '201':
          description: Account created and tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 300
                  username:
                    type: string
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  password:
                    type: string
                    example: 5f2d8e…(random hex)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Keycloak is unreachable or account creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /habits:
    get:
      summary: List all donated habits
      description: >-
        Returns all Habit nodes from the donation pipeline with uuid, original sentence,
        language, translationEN, and translationDE fields. Pass ?lang=en or ?lang=de
        to receive a displayText convenience field (translation with fallback to original).
      tags:
        - Habits
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - en
              - de
          description: >-
            If supplied, adds a displayText field — translationEN (with fallback to
            original) for en, translationDE (with fallback to original) for de.
      responses:
        '200':
          description: Array of donated habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonatedHabit'
              example:
                - uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  original: Ich gehe täglich 30 Minuten spazieren
                  language: de
                  translationEN: I walk for 30 minutes every day
                  translationDE: null
                  displayText: I walk for 30 minutes every day
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /habits/donate:
    post:
      summary: Donate a habit
      description: >-
        Orchestrates the three-stage habit donation pipeline:
        (1) classify-habit — determines whether the submission is a valid habit;
        (2) classify-context — extracts contextual dimensions (TIME, PHYSICAL_SETTING, etc.);
        (3) map-bcio — maps context phrases to BCIO ontology concepts.
        The Habit node is written to Neo4j with translationEN and translationDE fields
        produced by LibreTranslate + LLM refinement. Non-habit submissions are saved
        to MongoDB for review.
      tags:
        - Habits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sentence
                - language
              properties:
                sentence:
                  type: string
                  maxLength: 1000
                  description: Free-text habit description
                  example: I go for a 30-minute walk every morning before breakfast
                language:
                  type: string
                  description: >-
                    ISO 639-1 language code of the submitted sentence.
                    Supported: en, de, fr, es, it, pt, nl, pl, ru, zh
                  example: en
      responses:
        '201':
          description: Habit classified as valid and stored in Neo4j
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_habit:
                    type: boolean
                    example: true
                  uuid:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: Thank you! Your habit has been successfully donated.
        '200':
          description: Submission was not classified as a habit; saved for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_habit:
                    type: boolean
                    example: false
                  message:
                    type: string
        '400':
          description: Missing or invalid sentence or language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: sentence and language are required
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream API-service (habit classifier, context extractor, or BCIO mapper) failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
