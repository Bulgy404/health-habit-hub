              schema:
                type: object
                properties:
                  profile:
                    type: object
                    properties:
                      completed:
                        type: boolean
                      completedAt:
                        type: string
                        format: date-time
                        nullable: true
                  surveys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        completedAt:
                          type: string
