                  recommendations:
                    type: object
                    properties:
                      accepted:
                        type: integer
                      dismissed:
                        type: integer
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        detail:
                          type: string
              example:
                profile:
                  completed: true
                  completedAt: '2026-03-02T10:00:00.000Z'
                surveys:
                  - id: survey-uuid-001
                    title: Baseline Questionnaire
                    completedAt: '2026-03-03T11:00:00.000Z'
                habitsCount: 7
                recommendations:
                  accepted: 3
                  dismissed: 1
                timeline:
                  - type: enrolled
