        - Recommend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Free-text habit description to classify
                  example: I go for a 30-minute walk every morning
      responses:
        '200':
          description: Classification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  class:
                    type: string
                    example: Physical activity
                  confidence:
                    type: number
                    example: 0.92
                  bcioUri:
                    type: string
                    example: http://humanbehaviourchange.org/ontology/BCIO_000042
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recommend/generate:
    post:
      summary: Generate personalised habit recommendations
      description: >-
        Proxies to the Python recommender's POST /api/v1/llm/recommend (M3 single-LLM-call pipeline). The goal is
        guarded input: a prompt-injection screen (EN + DE) and an LLM refusal backstop reject shady or off-topic goals
        with 422 and a user-facing reason. Recommendations are written in the language of the goal. Each item carries
        paper citations (with DOI links when curated in API-service/data/references.json) and a suggested
        implementation-intention cue. Graph provenance (habit UUIDs) is logged and stored server-side, never returned.
      tags:
        - Recommend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - goal
                - session_id
              properties:
                user_id:
                  type: string
                  format: uuid
                goal:
                  type: string
                  maxLength: 2000
                  example: besser schlafen
                session_id:
                  type: string
      responses:
        '200':
          description: Generated recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendation_id:
                    type: string
                  goal:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        body:
                          type: string
                        rationale:
                          type: string
                          description: Plain language, cites papers in Author (Year) style
                        suggested_cue:
                          type: string
                          description: Suggested "when/where" trigger phrase for the implementation intention
                        sources:
                          type: array
                          description: Academic paper citations backing this recommendation
                          items:
                            type: object
                            properties:
                              filename:
                                type: string
                              title:
                                type: string
                              excerpt:
                                type: string
                                description: Preformatted citation, e.g. "Wood & Rünger (2016) — Psychology of Habit"
                              quote:
                                type: string
                                description: >-
                                  Verbatim sentence(s) from the paper backing this recommendation, when the LLM supplied
                                  one; empty otherwise
                              url:
                                type: string
                                description: DOI/publisher link when curated in references.json; empty otherwise
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Goal rejected by the input guard (prompt injection, harmful, or off-topic)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Only health-related goals are supported.
        '504':
          description: Recommender service timed out (RECOMMENDER_TIMEOUT_MS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile:
    get:
      summary: Get the authenticated user's profile
      description: Returns the profile (questionnaire answers + timestamps) for the caller identified by the JWT sub claim.
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                userId: a1b2c3d4-1234-5678-abcd-ef0123456789
                answers:
                  age: 30
                  goal: exercise more
                completedAt: '2026-03-15T10:00:00.000Z'
                updatedAt: '2026-03-15T10:00:00.000Z'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '404':
          description: Profile not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Profile not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create or update the authenticated user's profile
      description: Upserts the profile for the caller. Merges answers and updates timestamps.
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  additionalProperties: true
                  example:
                    age: 30
                    goal: exercise more
                completedAt:
                  type: string
                  format: date-time
                  example: '2026-03-15T10:00:00.000Z'
      responses:
        '200':
          description: Profile upserted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                userId: a1b2c3d4-1234-5678-abcd-ef0123456789
                answers:
                  age: 30
                  goal: exercise more
                completedAt: '2026-03-15T10:00:00.000Z'
                updatedAt: '2026-03-15T10:00:00.000Z'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /onboarding/redeem-code:
    post:
      summary: Redeem a study enrollment code
      description: First-time onboarding — enrolls the participant in the code's study/group.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: HHH-ABCDE
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '400':
          description: Missing or malformed code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already enrolled in a study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Code has expired, or hit its redemption limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /onboarding/skip-code:
    post:
      summary: Enroll in the default study (no code)
      description: >-
        Round-robin group assignment within the platform's default study. Idempotent — safe to call again for an
        already-enrolled user.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No default study configured, or it has no groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /onboarding/enrollment:
    get:
      summary: Get the participant's current study/group
      description: Powers the "Study membership" section on the account screen.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current enrollment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnrollmentResult'
                  - type: object
                    properties:
                      isDefaultStudy:
                        type: boolean
                      studyCodeUsed:
                        type: string
                        nullable: true
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not enrolled in any study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /onboarding/switch-study:
    post:
      summary: Move to a different study via code
      description: >
        Already-donated habits, logs, and questionnaire answers keep the studyId they were stamped with at the time —
        only activity from this point on is attributed to the new study. Nothing is deleted.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: HHH-ABCDE
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '400':
          description: Missing or malformed code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not currently enrolled in a study, or the code targets the study already enrolled in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Code has expired, or hit its redemption limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /onboarding/leave-study:
    post:
      summary: Leave the current study
      description: >
        Moves the participant back to the default study (round-robin group). No data is deleted; past
        donations/logs/answers stay attributed to the study being left.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Moved to the default study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not currently enrolled in a study, or already enrolled in the default study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No default study configured, or it has no groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
tags: []
