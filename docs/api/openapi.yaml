                type:
                  type: string
                  example: questionnaire
                jsonSchema:
                  type: object
                  description: SurveyJS JSON definition
                assignedGroups:
                  type: array
                  items:
                    type: string
                    enum:
                      - G1
                      - G2
                      - G3
                      - G4
                  example:
                    - G1
                    - G2
      responses:
        '201':
          description: Survey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
