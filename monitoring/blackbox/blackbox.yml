modules:
  # Services with a plain (unauthenticated) HTTP health/status endpoint.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: 'ip4'
      valid_status_codes: [] # defaults to 2xx

  # Services with no usable unauthenticated HTTP endpoint (auth-gated, or
  # plain TCP protocols like MongoDB/Postgres/Redis) — proves a listener is
  # up, not that auth against it works. See docs/runbook.md for the known
  # gap this leaves (e.g. a rotated Redis password wouldn't be caught here;
  # the app-level 5xx-rate alert is the backstop for that class of failure).
  tcp_connect:
    prober: tcp
    timeout: 5s
