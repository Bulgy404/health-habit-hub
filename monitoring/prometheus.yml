global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: hhh-app
    static_configs:
      - targets:
          - app:9091

  - job_name: traefik
    static_configs:
      - targets:
          - proxy:8082

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: habitvm

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          host: habitvm

  # Optional analytics-VM targets are rendered from ANALYTICS_VM_HOST by the
  # one-shot monitoring-targets service. The files contain [] until configured.
  - job_name: analytics-node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/analytics-node-exporter.json

  - job_name: analytics-cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/analytics-cadvisor.json

  - job_name: analytics-posthog
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/analytics-posthog.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Reachability probes via blackbox-exporter (see monitoring/blackbox/blackbox.yml
  # and docs/runbook.md) — covers every long-running service that doesn't
  # expose its own Prometheus metrics. Two jobs so each can use a different
  # probe module; the __address__ rewrite to blackbox-exporter:9115 is the
  # standard blackbox_exporter relabeling pattern.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:3000/api/v1/health
          # Verified-identity studies only. Absent unless the `identity`
          # compose profile is deployed — in which case the probe reports
          # down and the existing reachability alert fires, which is the
          # correct behaviour: an enrolling study needs this service up.
          - http://identity-service:3002/api/v1/health
          - http://translate:5000/languages
          - http://neo4j:7474
          # Keycloak health lives on the management port (9000), and
          # KC_HTTP_RELATIVE_PATH=/auth moves it under /auth — so it is
          # /auth/health/ready on 9000, NOT /health/ready on 8080 (404).
          - http://keycloak:9000/auth/health/ready
          - http://recommender:8000/health
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/grafana/api/health
          - http://backup:4100/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - mongo:27017
          - redis:6379
          - lightrag:9621
          - knowledge-mcp:8002
          - proxy:80
          # mongo-express is behind basic-auth (HTTP probe gets 401, not 2xx),
          # so probe the listener with TCP instead — matches the "auth-gated"
          # guidance in blackbox.yml.
          - mongo-express:8081
      # keycloak-db (Postgres) intentionally has no direct probe: local dev
      # uses Keycloak's embedded dev-file store (no keycloak-db container at
      # all — see docker-compose.local.yml), and in production a backing-store
      # failure already surfaces via the keycloak:9000/auth/health/ready probe above.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
