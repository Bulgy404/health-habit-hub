# Health Habit Hub security/resource overrides for PostHog's official hobby
# Compose stack. This file is always loaded after the pinned upstream files by
# manage.sh. `!override` requires Docker Compose 2.24.4 or newer.

x-node-service-limits: &node-service-limits
  mem_limit: 768m

x-small-service-limits: &small-service-limits
  mem_limit: 384m

services:
  # The only PostHog application port reachable from another host. Caddy uses
  # plain HTTP on the private network; habitvm terminates public TLS and exposes
  # only the ingest allowlist. Never set POSTHOG_BIND_ADDRESS to a public bind.
  proxy:
    # Caddy's site address comes from CADDY_HOST, but NOT from this block: the
    # upstream base file builds the whole Caddyfile as a CADDYFILE env string
    # containing ${CADDY_HOST:-http://localhost:8000}, which Compose expands at
    # config time from the .env file. A value set here lands in the container's
    # environment far too late — the Caddyfile text is already baked. So
    # CADDY_HOST must be set in .env, and is repeated here only so the two
    # cannot silently disagree.
    #
    # With the default, Caddy binds :8000 and matches only the host "localhost",
    # so mapping the host port to container :80 hit nothing at all and every
    # request was refused. .env now sets ':8000', which binds that port for any
    # host, and the mapping below targets it.
    ports: !override
      - '${POSTHOG_BIND_ADDRESS:?set POSTHOG_BIND_ADDRESS}:${POSTHOG_HTTP_PORT:-8000}:8000'
    environment:
      CADDY_TLS_BLOCK: ''
      CADDY_HOST: ':8000'
    mem_limit: 256m

  web:
    environment:
      SITE_URL: '${POSTHOG_SITE_URL:?set POSTHOG_SITE_URL}'
      OPT_OUT_CAPTURE: 'true'
    # NGINX Unit runs a hardcoded 4 Python app processes (the image's
    # /docker-entrypoint.d config sets "processes": 4; there is no env var for
    # it), measured at roughly 1062 + 750 + 437 + 432 MB RSS. 1024m killed the
    # migrate_clickhouse step outright; 3072m got through migrations but the
    # app processes kept being SIGKILLed afterwards — 58 signal-9 events, still
    # climbing at 6 per 75s, with the container pinned at 85% of its cap while
    # the host had 14 GiB free.
    mem_limit: 5120m

  worker:
    environment:
      SITE_URL: '${POSTHOG_SITE_URL:?set POSTHOG_SITE_URL}'
    mem_limit: 1024m

  temporal-django-worker:
    environment:
      SITE_URL: '${POSTHOG_SITE_URL:?set POSTHOG_SITE_URL}'
    # This runs the same Django stack as web, so 768m was well under what it
    # needs: the cgroup OOM-killed it (OOMKilled=true, "Killed python3 manage.py
    # start_temporal_worker") about ten hours into the first deployment.
    mem_limit: 1536m
    # Upstream leaves this on `on-failure`, which does not help here: bin/
    # temporal-django-worker catches the dead child, logs "Worker process no
    # longer exists, exiting" and returns 0. Docker sees a clean exit, declines
    # to restart, and the worker stays down silently — no unhealthy container,
    # no restart loop, nothing to alert on. `always` makes a kill recoverable
    # regardless of the exit code the wrapper reports.
    restart: always

  asyncmigrationscheck:
    environment:
      SITE_URL: '${POSTHOG_SITE_URL:?set POSTHOG_SITE_URL}'
    mem_limit: 512m

  db:
    mem_limit: 1536m

  clickhouse:
    mem_limit: 4096m

  kafka:
    # Upstream runs Redpanda with `--memory=3G --reserve-memory=500M`, and
    # seastar refuses to start if the cgroup gives it less: "insufficient
    # physical memory: needed 3221225472 available 500000000". 1024m was below
    # that floor, so kafka restart-looped and every dependant stayed Created.
    # 4096m leaves headroom above the 3G seastar demands.
    mem_limit: 4096m

  kafka-init:
    mem_limit: 256m

  zookeeper:
    mem_limit: 512m

  redis7:
    mem_limit: 384m

  valkey:
    mem_limit: 256m

  objectstorage:
    # MinIO withdrew its images from Docker Hub — `docker pull minio/minio` now
    # fails with "repository does not exist" for every tag, which aborts the
    # whole `compose pull`. quay.io is MinIO's own registry and carries the
    # identical tag the pinned upstream revision asks for; digest recorded
    # 2026-09-16.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    ports: !override []
    mem_limit: 512m

  seaweedfs:
    ports: !override []
    mem_limit: 512m

  temporal:
    ports: !override []
    mem_limit: 512m

  temporal-ui:
    ports: !override []
    mem_limit: 256m

  elasticsearch:
    mem_limit: 1024m

  browserless:
    mem_limit: 768m

  plugins:
    <<: *node-service-limits
  ingestion-general:
    <<: *node-service-limits
  ingestion-sessionreplay:
    <<: *small-service-limits
  recording-api:
    <<: *small-service-limits
  ingestion-error-tracking:
    <<: *small-service-limits
  ingestion-logs:
    <<: *small-service-limits
  ingestion-traces:
    <<: *small-service-limits

  capture:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/capture:master@sha256:7869522e4b65cf618a85af3d1dd04854c3b31dd9304af5ce8716020223ed30da
  capture-logs:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/capture-logs:master@sha256:e152db09a4bab345e5bd938b744cbcc2145105e374ebec26f8d7464da64657e0
  replay-capture:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/capture:master@sha256:7869522e4b65cf618a85af3d1dd04854c3b31dd9304af5ce8716020223ed30da
  property-defs-rs:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/property-defs-rs:master@sha256:6a3e9808b333fd6885665ee7677ade961cefba792254be276571128724890234
  livestream:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/livestream:master@sha256:6926f340b72d609e43cee5aa8b75a85cfdc77d182e610dafafdd81d3b2ab53f5
  personhog-replica:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/personhog-replica:master@sha256:e9a73dfacd5e0fb84919dc2aa58b2010e586a9e17b28a37620d6bdf65cc43776
  personhog-router:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/personhog-router:master@sha256:cb5a8f0652a3b4860f9ec73080b75d1bdcd4014e1417dccad19b79a13578931a
  feature-flags:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/feature-flags:master@sha256:3d9671d9856b7316b2d73ccc3dc3188266c54b79209f27f7453918ac42d74a37
  hypercache-server:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/hypercache-server:master@sha256:e9009448fb256c2ea37d0df3bced559656330c6c0bc9678e9b4ec1d5facfb1ac
  cymbal:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/cymbal:master@sha256:7a7ddc13690f87777b2dc7e3f66c4677a14f060470268d2f33141a1fb7edf2cc
  cymbal-resolution:
    <<: *small-service-limits
    image: ghcr.io/posthog/posthog/cymbal:master@sha256:7a7ddc13690f87777b2dc7e3f66c4677a14f060470268d2f33141a1fb7edf2cc
  temporal-admin-tools:
    <<: *small-service-limits

  # Exporters are part of the analytics-VM package but do not publish to all
  # interfaces. The habitvm firewall should be the only allowed source.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: hhh-analytics-node-exporter
    restart: always
    mem_limit: 128m
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/host/root
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/netns/.+)($|/)
    ports:
      - '${POSTHOG_BIND_ADDRESS:?set POSTHOG_BIND_ADDRESS}:9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave

  cadvisor:
    # v0.60.5 was never published — `docker manifest inspect` returns "not
    # found" and it aborted the whole pull. v0.52.1 is the current release on
    # gcr.io; digest recorded 2026-09-16.
    image: gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    container_name: hhh-analytics-cadvisor
    restart: always
    mem_limit: 256m
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - '${POSTHOG_BIND_ADDRESS:?set POSTHOG_BIND_ADDRESS}:8080:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # One-shot operational helper. It shares ClickHouse's data mounts so
  # clickhouse-backup can create a consistent snapshot, but it is never part
  # of the normal `up` service set because the `ops` profile is opt-in.
  clickhouse-backup:
    image: altinity/clickhouse-backup:2.7.0@sha256:2714c3df5137e93b23a3e45054c95183e1e0abce21e688e9274cd82c8ea56225
    profiles: [ops]
    restart: 'no'
    mem_limit: 512m
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USERNAME: '${CLICKHOUSE_USER:-default}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-}'
      REMOTE_STORAGE: none
      BACKUPS_TO_KEEP_LOCAL: 2
    volumes_from:
      - clickhouse
    volumes:
      - '${ANALYTICS_BACKUP_DIR:-/data/posthog-backups}:/backup-output'
    depends_on:
      clickhouse:
        condition: service_healthy
